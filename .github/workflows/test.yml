name: test

on:
  push:
    paths-ignore: ["data/**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev]'
      # The retired v1 pipeline (src/gauges) keeps its tests in the repo, but they are no longer run here.
      - run: python -m pytest tests/test_signals.py
