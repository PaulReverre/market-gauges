name: refresh

# Rebuilds data/signals.json after every US session and commits it; Vercel
# redeploys on the commit. The build re-downloads full history each time, so a
# missed day heals itself on the next run. Everything here is free: GitHub
# Actions minutes, Yahoo, Cboe, FRED, Shiller, SSGA, Nebius, Finnhub's free tier.
on:
  schedule:
    - cron: "0 2 * * 2-6"     # 02:00 UTC Tue-Sat = evening ET after the Mon-Fri close
    - cron: "0 10 * * 2-6"    # retry: only rebuilds if the first run failed or an input posted late
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}         # optional: FRED's keyless CSV is the fallback
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}   # optional: earnings columns in the AI table
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Build signals
        run: |
          if [ "${{ github.event.schedule }}" = "0 10 * * 2-6" ]; then
            python -m signals.build --if-stale
          else
            python -m signals.build
          fi
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals.json data/signals_history.json data/state
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "data: signals $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
