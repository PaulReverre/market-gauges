name: refresh

# Spec Section 11: daily after the US close, weekly on Saturday, monthly after
# TSMC/MOPS publish (~10th). Each run restores the store from data/archive,
# pulls its source group, scores, renders, and commits the new data back.
on:
  schedule:
    - cron: "0 2 * * 2-6"    # daily: Tue-Sat 02:00 UTC = 7pm PDT / 6pm PST, Mon-Fri sessions
    - cron: "0 14 * * 6"     # weekly: Saturday (CFTC, NAAIM, AAII, FactSet, Census BTOS)
    - cron: "0 14 12 * *"    # monthly: the 12th (FINRA, MOPS, Shiller, Uvik, EIA; tsmc is in ci_skip)
  workflow_dispatch:
    inputs:
      cadence:
        description: Source group to pull
        type: choice
        options: [all, daily, weekly, monthly]
        default: all

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Pick source group
        id: cadence
        run: |
          case "${{ github.event.schedule }}" in
            "0 2 * * 2-6")  group=daily ;;
            "0 14 * * 6")   group=weekly ;;
            "0 14 12 * *")  group=monthly ;;
            *)              group="${{ inputs.cadence || 'all' }}" ;;
          esac
          echo "group=$group" >> "$GITHUB_OUTPUT"
          echo "Source group: $group"
      - name: Restore store from data/archive
        run: python -m gauges.archive restore
      - name: Ingest
        run: python -m gauges.ingest --cadence "${{ steps.cadence.outputs.group }}"
      - name: Score
        run: python -m gauges.score
      - name: Render
        run: python -m gauges.render
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json data/archive
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "data: ${{ steps.cadence.outputs.group }} refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push

  # GitHub Pages: set the repository variable PAGES_ENABLED=true and choose
  # "GitHub Actions" as the Pages source (Settings > Pages). Private repos need
  # a paid plan for Pages; Vercel (vercel.json) is the alternative.
  pages:
    needs: refresh
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Build site
        run: |
          mkdir -p _site/data _site/reports
          cp -r dashboard _site/
          cp data/latest.json data/history.json _site/data/
          cp reports/validation.md _site/reports/
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=dashboard/"><a href="dashboard/">Market Gauges</a>\n' > _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
