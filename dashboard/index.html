<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Gauges</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 22a12 12 0 0 1 24 0' fill='none' stroke='%232a78d6' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M16 22l6-8' stroke='%230b0b0b' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">

<style>
/* Tokens. Bands b1..b5 are a diverging scale (fear/weak red <- neutral gray -> blue greed/strong),
   each arm validated as an ordinal ramp per mode. Series s1..s3 are categorical slots 1-3. */
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --wash: #f1f0ec;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --base: #c3c2b7; --ring: rgba(11, 11, 11, .10);
  --link: #256abf;
  --b1: #c9403e; --b2: #ee9a92; --b3: #bdbbb2; --b4: #86b6ef; --b5: #256abf;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --wash: #242422;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --base: #383835; --ring: rgba(255, 255, 255, .10);
    --link: #6da7ec;
    --b1: #ee6b67; --b2: #8f3f3c; --b3: #4a4945; --b4: #1c5cab; --b5: #6da7ec;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --wash: #242422;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --base: #383835; --ring: rgba(255, 255, 255, .10);
  --link: #6da7ec;
  --b1: #ee6b67; --b2: #8f3f3c; --b3: #4a4945; --b4: #1c5cab; --b5: #6da7ec;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 4px; }

/* Header */
header.top { border-bottom: 1px solid var(--grid); background: var(--page); }
.bar { display: flex; align-items: center; gap: 6px 20px; flex-wrap: wrap; padding: 12px 16px; }
.brand { font-weight: 650; font-size: 15px; letter-spacing: -.01em; color: var(--ink); }
.tabs { display: flex; gap: 2px; }
.tabs button, .tabs a { background: none; border: 0; color: var(--ink-2); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 13.5px; }
.tabs a:hover, .tabs button:hover { background: var(--wash); text-decoration: none; color: var(--ink); }
.tabs [aria-selected="true"] { color: var(--ink); background: var(--wash); font-weight: 550; }
.meta { margin-left: auto; display: flex; align-items: center; gap: 4px 14px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; }
.meta b { color: var(--ink-2); font-weight: 550; }
.iconbtn { background: none; border: 1px solid var(--grid); border-radius: 6px; padding: 3px 9px; cursor: pointer; color: var(--ink-2); font-size: 12.5px; }
.iconbtn:hover { background: var(--wash); }
details.pop { position: relative; }
details.pop > summary { list-style: none; cursor: pointer; }
details.pop > summary::-webkit-details-marker { display: none; }
details.pop .panel { position: absolute; right: 0; top: 30px; width: min(420px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .16); z-index: 30; color: var(--ink); font-size: 12.5px; }
.panel h4 { margin: 0 0 6px; font-size: 12.5px; }
.panel ul { margin: 0 0 10px; padding-left: 16px; }
.panel li { margin: 0 0 5px; }
.panel .msg { color: var(--muted); word-break: break-word; }

/* Status: always a dot plus a word */
.sdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--muted); }
.sdot.good { background: var(--good); } .sdot.warning { background: var(--warning); }
.sdot.serious { background: var(--serious); } .sdot.critical { background: var(--critical); }
.sdot.off { background: transparent; box-shadow: inset 0 0 0 1.5px var(--base); }
.issues-btn { display: inline-flex; align-items: center; gap: 6px; }

main { padding: 8px 0 48px; }
.block { padding: 28px 0 4px; }
.block + .block { border-top: 1px solid var(--grid); margin-top: 24px; }
.bhead { display: flex; align-items: baseline; gap: 8px 16px; flex-wrap: wrap; margin-bottom: 14px; }
.bhead h2 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
.bhead .sub { color: var(--muted); font-size: 12.5px; }
.bhead .right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.note { color: var(--muted); font-size: 12px; margin: 10px 0 0; max-width: 900px; }

/* Alerts */
.alerts { display: grid; gap: 8px; margin-top: 16px; }
.alert { display: flex; gap: 10px; align-items: baseline; padding: 10px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--ring); }
.alert .sdot { transform: translateY(1px); }

/* Segmented control */
.seg { display: inline-flex; background: var(--wash); border-radius: 8px; padding: 2px; gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg button { background: none; border: 0; padding: 4px 10px; border-radius: 6px; cursor: pointer; color: var(--ink-2); font-size: 12.5px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--ring); font-weight: 550; }

/* Overview tiles */
.groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 20px; }
.group h3 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 8px; letter-spacing: .02em; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 14px 16px 12px; cursor: pointer; text-align: left; min-width: 0; transition: border-color .12s; }
.tile:hover { border-color: var(--base); }
.tile[aria-pressed="true"] { border-color: var(--ink-2); }
.tile .tname { font-size: 13px; color: var(--ink-2); font-weight: 550; }
.tile .readout { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 10px; flex-wrap: wrap; }
.tile .val { font-size: 34px; font-weight: 650; letter-spacing: -.02em; line-height: 1; }
.bandlbl { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 550; color: var(--ink); }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.scale { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; height: 6px; }
.scale i { background: var(--grid); }
.scale i:first-child { border-radius: 3px 0 0 3px; } .scale i:last-child { border-radius: 0 3px 3px 0; }
.scale .mark { position: absolute; top: -5px; width: 3px; height: 16px; border-radius: 2px; background: var(--ink); transform: translateX(-50%); box-shadow: 0 0 0 2px var(--surface); }
.ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 5px; }
.deltas { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); margin-top: 10px; flex-wrap: wrap; }
.deltas span b { font-weight: 400; color: var(--muted); margin-right: 4px; }
.spark { position: relative; height: 34px; margin-top: 10px; }
.spark svg { display: block; width: 100%; height: 100%; overflow: visible; }
.spark .dot { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); transform: translate(-50%, -50%); box-shadow: 0 0 0 2px var(--surface); }
.tfoot { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.tfoot .low { display: inline-flex; gap: 5px; align-items: center; color: var(--ink-2); }

/* Detail */
.summary { color: var(--ink-2); font-size: 13px; margin: -4px 0 18px; }
.summary b { color: var(--ink); font-weight: 600; }
.detail { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 32px; }
.panelcol { align-self: start; position: sticky; top: 16px; }
.panelcol h4 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 10px; letter-spacing: .02em; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.panelcol section + section { margin-top: 26px; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) 96px 38px; gap: 10px; align-items: center; font-size: 13px; padding: 5px 0; }
.prow .pn small { color: var(--muted); font-size: 11.5px; margin-left: 4px; }
.prow .pv { text-align: right; }
.dbar { position: relative; height: 8px; background: var(--wash); border-radius: 4px; }
.dbar::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--base); }
.dbar b { position: absolute; top: 0; bottom: 0; }
.dbar b.lo { border-radius: 4px 0 0 4px; } .dbar b.hi { border-radius: 0 4px 4px 0; }
.dbar.mini { display: inline-block; width: 56px; height: 6px; vertical-align: middle; margin-left: 8px; }
.drow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; font-size: 13px; padding: 4px 0; color: var(--ink-2); }
.drow .num { color: var(--ink); }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: 13px; color: var(--ink-2); }
.kv .num { color: var(--ink); text-align: right; }
.linkbtn { background: none; border: 0; color: var(--link); cursor: pointer; padding: 0; font-size: 12.5px; }
.linkbtn:hover { text-decoration: underline; }

/* Tables */
.tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.data { border-collapse: collapse; width: 100%; font-size: 13px; }
.data th, .data td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; vertical-align: middle; }
.data th { color: var(--muted); font-weight: 550; font-size: 12px; border-bottom-color: var(--base); }
.data th[data-sort] { cursor: pointer; user-select: none; }
.data th[data-sort]:hover { color: var(--ink); }
.data th[aria-sort="ascending"]::after { content: " ↑"; } .data th[aria-sort="descending"]::after { content: " ↓"; }
.data .r { text-align: right; }
.data td.name { white-space: normal; min-width: 220px; }
.data td.name small { display: block; color: var(--muted); font-size: 11.5px; }
.data tr.grp th { color: var(--ink); font-size: 12.5px; font-weight: 600; padding-top: 18px; border-bottom-color: var(--grid); }
.data tr.grp th span { color: var(--muted); font-weight: 400; margin-left: 8px; }
.data tr.inactive td { color: var(--muted); }
.data .opt { display: none; }
.data.all .opt { display: table-cell; }
.tag { display: inline-block; font-size: 11px; color: var(--muted); margin-left: 6px; white-space: nowrap; }
.tag::before { content: "· "; }
.tblbar { display: flex; gap: 14px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.zbar { position: relative; display: inline-block; width: 72px; height: 6px; background: var(--wash); border-radius: 3px; vertical-align: middle; }
.zbar::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--base); }
.zbar b { position: absolute; top: 0; bottom: 0; }
svg.mspark { display: block; }

/* Signals */
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; }
.sig h3 { font-size: 13.5px; margin: 0 0 4px; font-weight: 600; }
.sig .lede { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
.bignum { font-size: 28px; font-weight: 650; letter-spacing: -.02em; }
.meter { height: 6px; border-radius: 3px; background: var(--wash); margin: 8px 0 4px; overflow: hidden; }
.meter b { display: block; height: 100%; border-radius: 3px; background: var(--b1); }
.srow { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }
.srow:last-child { border-bottom: 0; }
.srow .sdot { transform: translateY(1px); }
.srow .st { color: var(--ink-2); font-size: 12.5px; white-space: nowrap; }
.srow small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) 80px 34px; gap: 10px; align-items: center; font-size: 12.5px; color: var(--ink-2); padding: 3px 0; }
.mtrack { height: 5px; background: var(--wash); border-radius: 3px; overflow: hidden; }
.mtrack b { display: block; height: 100%; background: var(--b1); border-radius: 3px; }
.subhead { font-size: 12px; font-weight: 600; color: var(--muted); margin: 18px 0 4px; }

/* History */
#histchart { height: 440px; }

/* Lists */
.lrow { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--grid); font-size: 13px; align-items: baseline; }
.lrow:last-child { border-bottom: 0; }
.lrow .when { color: var(--muted); font-size: 12px; }
.lrow .k { color: var(--muted); font-size: 12px; }

/* Methodology */
.method h2 { font-size: 16px; margin: 28px 0 10px; }
.method ul { padding-left: 18px; margin: 0; max-width: 900px; }
.method li { margin: 5px 0; color: var(--ink-2); }
select { font: inherit; font-size: 12.5px; background: var(--surface); color: var(--ink); border: 1px solid var(--grid); border-radius: 6px; padding: 3px 6px; }

footer { color: var(--muted); font-size: 11.5px; padding: 24px 0 0; border-top: 1px solid var(--grid); margin-top: 32px; }
footer p { margin: 3px 0; }
.err { padding: 60px 16px; text-align: center; color: var(--muted); }

@media (max-width: 1100px) {
  .groups { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 960px) {
  .detail, .two { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .panelcol { position: static; }
}
@media (max-width: 720px) {
  .meta { margin-left: 0; width: 100%; }
  #histchart { height: 380px; }
}
@media (max-width: 520px) {
  .tiles { grid-template-columns: minmax(0, 1fr); }
  .tile .val { font-size: 30px; }
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
</head>
<body>
<header class="top">
  <div class="bar wrap">
    <span class="brand">Market Gauges</span>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" data-tab="dash" aria-selected="true">Overview</button>
      <button role="tab" data-tab="method" aria-selected="false">Methodology</button>
      <a href="backtest.html">Backtest</a>
    </nav>
    <div class="meta" id="meta">Loading…</div>
  </div>
</header>
<main class="wrap">
  <section id="tab-dash">
    <div class="alerts" id="alerts"></div>
    <div class="groups" id="overview"></div>

    <section class="block" id="detail-block">
      <div class="bhead"><h2>Inside the gauge</h2><div class="right"><div class="seg" id="gsel" role="group" aria-label="Gauge"></div></div></div>
      <div id="detail"></div>
    </section>

    <section class="block" id="signals">
      <div class="bhead"><h2>Risk signals</h2><span class="sub">Overlays shown beside the gauges, not inside them</span></div>
      <div class="two"><div class="sig" id="fragility"></div><div class="sig" id="unwind"></div></div>
    </section>

    <section class="block">
      <div class="bhead"><h2>History</h2><span class="sub" id="histnote"></span>
        <div class="right"><div class="seg" id="histmode" role="group" aria-label="Market"></div><div class="seg" id="histrange" role="group" aria-label="Range"></div></div></div>
      <div id="histchart" role="img" aria-label="Gauge history with the index price above"></div>
    </section>

    <section class="block" id="valuation"></section>
    <section class="block" id="aicos"></section>

    <section class="block">
      <div class="two">
        <div><div class="bhead"><h2>Catalysts</h2><span class="sub">next 30 days</span></div><div id="catalysts"></div></div>
        <div><div class="bhead"><h2>Biggest moves this week</h2><span class="sub">indicator score change, 5 trading days</span></div><div id="movers"></div></div>
      </div>
    </section>

    <section class="block" id="watchlist"></section>
  </section>
  <section id="tab-method" class="method" hidden></section>
  <footer id="footer"></footer>
</main>

<script>
"use strict";
const DATA_PATHS = ["../data/", "data/", "./"];
const GAUGE_IDS = ["G1", "G2", "G3", "G4"];
const SHORT = {
  G1: ["US equity", "Sentiment & volatility"], G2: ["US equity", "Fundamental state"],
  G3: ["AI sector", "Sentiment & volatility"], G4: ["AI sector", "Fundamental health"],
};
const SEG_LABELS = { G1: "Equity sentiment", G2: "Equity fundamentals", G3: "AI sentiment", G4: "AI fundamentals" };
const PILLAR_NAMES = {
  volatility: "Volatility & options", trend_breadth: "Trend & breadth", credit_funding: "Credit & funding",
  positioning: "Positioning & surveys", safe_haven: "Safe haven & cross-asset", growth: "Growth & cycle",
  earnings: "Earnings", valuation: "Valuation", rates_liquidity: "Rates & liquidity", consumer_credit: "Consumer & credit",
  trend_rs: "Trend & relative strength", implied_vol: "Implied vol & skew", crowding: "Crowding & reaction",
  attention: "Attention", compute_demand: "Compute demand", spend: "Spend", supply_chain: "Supply chain",
  monetization: "Monetization", compute_econ: "Compute economics", financing: "Financing & credit",
};
const LIGHT_STATUS = { red: ["critical", "Red"], amber: ["warning", "Amber"], green: ["good", "Green"], grey: ["off", "No signal"] };
const UNWIND_RULES = {
  capacity_loosens_growth_flat: ["Capacity loosens, growth flat", "Red: H100 rental down >10% over 3 months and (lab Q/Q revenue add falling or token growth < 0). Amber: one leg."],
  labs_cut_prices: ["Labs cut prices", "Red: flagship token price down >20% in 30 days (same models, so launches don't count) or a price-cut event. Amber: >10%."],
  hyperscalers_trim_2027_capex: ["Hyperscalers trim 2027 capex", "Red: any of MSFT, GOOGL, AMZN, META frames 2027 capex below prior framing. Amber: two or more hold flat. Green: raised."],
  ai_credit_spreads_widen: ["AI credit spreads widen", "Red: BBB OAS +25bp in 21 days, ORCL/CRWV drawdown in its worst decile, or a material CDS/financing event. Amber: half thresholds."],
};
const AI_FLAGS = {
  smh_near_high_with_weak_breadth: "SMH within 5% of its high while under half the basket is above its 50-day",
  basket_correlation_top_decile: "Basket correlation in its top decile",
  beat_fade_rising_two_seasons: "Beat-and-fade share rising two seasons",
  iv_spread_rising_with_price: "NVDA IV premium rising while price rises",
  memory_drawdown_over_25pct: "Memory layer more than 25% below its high",
};
const BANNERS = {
  complacent_and_fragile: ["Complacent and fragile", "G1 ≥ 70 and fragility ≥ 70: the highest-risk combination.", "critical"],
  fear_without_fundamental_damage: ["Fear without fundamental damage", "G1 ≤ 25 and G2 ≥ 50: historically favorable.", "good"],
  sentiment_ahead_of_fundamentals: ["Sentiment ahead of fundamentals", "G1 ≥ 70 while G2 has fallen three weeks running.", "warning"],
};
const HIDE_TAGS = new Set(["verified", "single-source"]);
const RANGES = [["1Y", 252], ["5Y", 1260], ["10Y", 2520], ["Max", Infinity]];

let LATEST = null, HISTORY = null, HCHART = null;
const state = { gauge: "G1", drivers: "1w", showDisplay: false, more: false, hist: "equity", range: "5Y", legend: { Fragility: false } };

/* ----------------------------------------------------------------- helpers */
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const band = (v) => v == null ? null : Math.min(4, Math.max(0, Math.floor(v / 20)));
const bandVar = (v) => v == null ? "var(--grid)" : `var(--b${band(v) + 1})`;
const isNum = (v) => typeof v === "number" && !Number.isNaN(v);
const MINUS = "−";

function fmt(v) {
  if (v === null || v === undefined || Number.isNaN(v)) return "—";
  if (typeof v === "boolean") return v ? "yes" : "no";
  if (typeof v !== "number") return String(v);
  const a = Math.abs(v);
  let s;
  if (a >= 1e12) s = (a / 1e12).toFixed(2) + "T";
  else if (a >= 1e9) s = (a / 1e9).toFixed(2) + "B";
  else if (a >= 1e6) s = (a / 1e6).toFixed(2) + "M";
  else if (a >= 1000) s = Math.round(a).toLocaleString("en-US");
  else if (a >= 100) s = a.toFixed(1);
  else if (a >= 1) s = a.toFixed(2);
  else s = a.toFixed(3);
  return (v < 0 ? MINUS : "") + s;
}
const r1 = (v) => Math.round(v * 10) / 10 || 0;   // rounds -0.04 to 0, never -0
const fmt1 = (v) => isNum(v) ? (r1(v) < 0 ? MINUS : "") + Math.abs(r1(v)).toFixed(1) : "—";
const signed = (v) => isNum(v) ? (r1(v) > 0 ? "+" : r1(v) < 0 ? MINUS : "") + Math.abs(r1(v)).toFixed(1) : "—";
const axisFmt = (v) => v >= 1000 ? Math.round(v).toLocaleString("en-US") : String(+v.toPrecision(3));
const pctS = (v) => isNum(v) ? signed(v) + "%" : "—";
const dateLbl = (d) => d ? new Date(d + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "—";
const shortDate = (d) => d ? new Date(d + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "—";
const dayDate = (d) => new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
const when = (iso, opts) => new Date(iso).toLocaleString("en-US", opts);
const human = (s) => String(s || "").replaceAll("_", " ").replace(/^./, (c) => c.toUpperCase());
const pname = (p) => PILLAR_NAMES[p] || human(p);
const dv = (v) => isNum(v) ? ` data-v="${v}"` : "";

function dbar(v, cls = "") {
  if (!isNum(v)) return `<span class="dbar ${cls}" aria-hidden="true"></span>`;
  const lo = v < 50;
  return `<span class="dbar ${cls}" aria-hidden="true"><b class="${lo ? "lo" : "hi"}" style="left:${Math.min(v, 50)}%;width:${Math.abs(v - 50)}%;background:${bandVar(v)}"></b></span>`;
}

async function load(name) {
  for (const base of DATA_PATHS) {
    try {
      const r = await fetch(base + name, { cache: "no-cache" });
      if (r.ok) return await r.json();
    } catch (e) { /* try the next path */ }
  }
  throw new Error(`Could not load ${name}`);
}

function cycleTheme() {
  const order = ["auto", "light", "dark"];
  const cur = (document.documentElement.dataset.theme || "auto");
  const next = order[(order.indexOf(cur) + 1) % order.length];
  if (next === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = next;
  try { if (next === "auto") localStorage.removeItem("mg-theme"); else localStorage.setItem("mg-theme", next); } catch (e) { /* ignore */ }
  document.getElementById("themebtn").textContent = themeLabel();
  renderHistory();
}

/* ---------------------------------------------------------------- overview */
function sparkSvg(values) {
  const n = values.length;
  if (n < 2 || values.every((v) => v == null)) return "";
  const W = 200, H = 34, y = (v) => H - 2 - v / 100 * (H - 4);
  let d = "", pen = false;
  values.forEach((v, i) => {
    if (v == null) { pen = false; return; }
    d += `${pen ? "L" : "M"}${(i / (n - 1) * W).toFixed(1)} ${y(v).toFixed(1)}`;
    pen = true;
  });
  let li = n - 1;
  while (li > 0 && values[li] == null) li--;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <line x1="0" x2="${W}" y1="${y(50)}" y2="${y(50)}" style="stroke:var(--grid)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <path d="${d}" fill="none" style="stroke:var(--ink-2)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </svg><span class="dot" style="left:${li / (n - 1) * 100}%;top:${y(values[li]) / H * 100}%"></span>`;
}

function tile(id, g) {
  const [, title] = SHORT[id];
  const prev = g.ghosts.prev_close;
  const d1 = prev == null || g.display == null ? null : g.display - prev;
  const hist = HISTORY ? HISTORY.gauges[id].display.slice(-126) : [];
  const b = band(g.display);
  const tip = `${g.name}: ${fmt1(g.display)} ${g.band || ""}${g.smoothing === "ema3" ? ` (3-day EMA; raw ${fmt1(g.score)})` : ""} · as of ${g.as_of} · coverage ${fmt1(g.coverage)}%`;
  return `<article class="tile" role="button" tabindex="0" data-g="${id}" aria-pressed="${state.gauge === id}" title="${esc(tip)}">
    <div class="tname">${esc(title)} <span class="muted">· ${id}</span></div>
    <div class="readout"><span class="val">${fmt1(g.display)}</span>
      <span class="bandlbl"><span class="sw" style="background:${bandVar(g.display)}"></span>${esc(g.band || "No score")}</span></div>
    <div class="scale" aria-hidden="true">${[0, 1, 2, 3, 4].map((i) => `<i style="${i === b ? `background:var(--b${i + 1})` : ""}"></i>`).join("")}
      ${g.display == null ? "" : `<span class="mark" style="left:${g.display}%"></span>`}</div>
    <div class="ends"><span>${esc(g.scale[0])}</span><span>${esc(g.scale[4])}</span></div>
    <div class="deltas"><span><b>1D</b>${signed(d1)}</span><span><b>1W</b>${signed(g.change_1w)}</span><span><b>1M</b>${signed(g.change_1m)}</span></div>
    <div class="spark">${sparkSvg(hist)}</div>
    <div class="tfoot"><span>6 months</span>${g.low_coverage
      ? `<span class="low" title="Live share of target weight is below 70%"><span class="sdot warning"></span>Low coverage ${fmt1(g.coverage)}%</span>`
      : `<span title="Live share of target weight">Coverage ${fmt1(g.coverage)}%</span>`}</div>
  </article>`;
}

function miniSpark(points) {
  const pts = (points || []).map((v) => v == null ? null : v);
  if (pts.filter((v) => v != null).length < 2) return "";
  const w = 72, h = 18, n = pts.length;
  let d = "", pen = false;
  pts.forEach((v, i) => {
    if (v == null) { pen = false; return; }
    d += `${pen ? "L" : "M"}${(i / (n - 1) * w).toFixed(1)} ${(h - 2 - v / 100 * (h - 4)).toFixed(1)}`;
    pen = true;
  });
  return `<svg class="mspark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><line x1="0" x2="${w}" y1="${h / 2}" y2="${h / 2}" style="stroke:var(--grid)"/><path d="${d}" fill="none" style="stroke:var(--ink-2)" stroke-width="1.3"/></svg>`;
}

function componentRows(id, g) {
  const greedy = id === "G1" || id === "G3";
  const rows = [];
  for (const p of Object.keys(g.pillars)) {
    const members = g.components.filter((c) => c.pillar === p);
    const active = members.filter((c) => c.active).sort((a, b) => (b.target_weight - a.target_weight) || a.name.localeCompare(b.name));
    const shown = state.showDisplay ? [...active, ...members.filter((c) => !c.active)] : active;
    if (!shown.length) continue;
    rows.push(`<tr class="grp"><th colspan="12">${esc(pname(p))}<span>${g.pillar_weights[p]}% of gauge · score ${fmt1(g.pillars[p])}</span></th></tr>`);
    for (const c of shown) {
      const tags = c.badges.filter((b) => !HIDE_TAGS.has(b)).map((b) => `<span class="tag">${esc(b.replace("-", " "))}</span>`).join("")
        + (c.validation ? `<span class="tag" title="${esc(c.validation)}">validated out</span>` : "");
      const trust = c.badges.includes("verified") ? "cross-checked against a second source" : c.badges.includes("single-source") ? "single source" : "";
      rows.push(`<tr class="${c.active ? "" : "inactive"}">
        <td class="name" title="${esc(c.id)}${c.notes ? " — " + esc(c.notes) : ""}">${esc(c.name)}${tags}</td>
        <td class="opt ink2">${esc(c.role)}${c.cnn ? " · CNN row" : ""}${c.fragility ? " · fragility" : ""}</td>
        <td class="r num opt" title="${esc(c.source)}${c.as_of ? " · observation " + c.as_of : ""}${c.published ? " · public " + c.published : ""}">${fmt(c.value)}</td>
        <td class="r num opt" title="Percentile within its trailing window">${fmt1(c.pct)}</td>
        <td class="r num" title="Oriented score: 100 = ${greedy ? "greed" : "healthy"}">${fmt1(c.score)}${dbar(c.score, "mini")}</td>
        <td class="r num" title="Live weight after staleness and status multipliers / target weight, % of the gauge">${c.active ? `${fmt1(c.live_weight)}<span class="muted"> / ${fmt1(c.target_weight)}</span>` : `<span class="muted">display</span>`}</td>
        <td class="r num" title="Points this indicator contributes to the gauge">${fmt1(c.contribution)}</td>
        <td class="r num">${signed(c.change_1w)}</td>
        <td class="r num opt">${signed(c.change_1m)}</td>
        <td class="opt" title="Score, last 6 months">${miniSpark(c.spark)}</td>
        <td class="num">${c.as_of ? shortDate(c.as_of) : "—"}</td>
        <td title="${esc(c.source)}${trust ? " · " + trust : ""}">${c.source_url ? `<a href="${esc(c.source_url)}" target="_blank" rel="noopener">${esc(c.source.length > 26 ? c.source.slice(0, 25) + "…" : c.source)}</a>` : `<span class="muted">${esc(c.source)}</span>`}</td>
      </tr>`);
    }
  }
  return rows.join("");
}

/* ----------------------------------------------------------------- signals */
function renderSignals(d) {
  const f = d.fragility;
  const comps = Object.values(d.gauges).flatMap((g) => g.components);
  const members = f.members.map((mid) => comps.find((c) => c.id === mid)).filter(Boolean).map((c) => {
    const frag = c.pct == null ? null : (c.fragility === "higher_is_fragile" ? c.pct : 100 - c.pct);
    return `<div class="mrow" title="${esc(c.name)}: fragility reading ${fmt1(frag)} · as of ${c.as_of || "—"}"><span>${esc(c.name)}</span><span class="mtrack"><b style="width:${frag ?? 0}%"></b></span><span class="num" style="text-align:right">${fmt1(frag)}</span></div>`;
  }).join("");
  const prob = typeof f.drawdown_probability === "string"
    ? `${esc(f.drawdown_probability)}: the backtest found no reliable link between this overlay and later 10%+ drawdowns, so no probability is shown.`
    : `${f.drawdown_probability.probability_pct}% of days in this decile saw a 10%+ S&amp;P drawdown within 63 trading days (${f.drawdown_probability.sample_days} days).`;
  const r = f.divergence_rule;
  document.getElementById("fragility").innerHTML = `
    <h3>Equity fragility overlay</h3>
    <p class="lede">0 calm · 100 fragile. ${prob}</p>
    <div class="bignum">${fmt1(f.score)}</div>
    <div class="meter" aria-hidden="true"><b style="width:${f.score ?? 0}%"></b></div>
    <div class="srow" style="margin-top:8px"><span class="sdot ${f.breadth_divergence ? "serious" : "off"}"></span>
      <span>Breadth divergence<small>S&amp;P within ${r.near_high_pct}% of its 52-week high while under ${r.breadth_below}% of members are above their 200-day</small></span>
      <span class="st">${f.breadth_divergence ? "On" : "Off"}</span></div>
    <div class="subhead">Members (fragility reading)</div>${members}`;

  const u = d.unwind;
  const show = (x) => x && typeof x === "object" ? (Object.keys(x).length ? Object.entries(x).map(([a, b]) => `${a} ${b}`).join(", ") : "none yet") : fmt(x);
  const lights = Object.entries(u.lights).map(([k, v]) => {
    const [title, rule] = UNWIND_RULES[k] || [human(k), ""];
    const [cls, word] = LIGHT_STATUS[v.state] || ["off", v.state];
    const inputs = Object.entries(v).filter(([n]) => n !== "state").map(([n, x]) => `${n.replaceAll("_", " ")}: ${show(x)}`).join(" · ");
    return `<div class="srow" title="${esc(rule)}"><span class="sdot ${cls}"></span><span>${esc(title)}<small>${esc(inputs)}</small></span><span class="st">${esc(word)}</span></div>`;
  }).join("");
  const flags = Object.entries(d.ai_fragility).map(([k, v]) =>
    `<div class="srow"><span class="sdot ${v === true ? "serious" : "off"}"></span><span>${esc(AI_FLAGS[k] || human(k))}</span><span class="st">${v === true ? "On" : v === false ? "Off" : "No data"}</span></div>`).join("");
  document.getElementById("unwind").innerHTML = `
    <h3>AI unwind signature · ${u.red_count} of 4 red</h3>
    <p class="lede">One weak print is noise; the signal is these turning red together. Hover a row for its rule.</p>
    ${lights}
    <div class="subhead">AI fragility flags</div>${flags}`;
}

  const ax = { axisLine: { lineStyle: { color: css("--base") } }, axisTick: { show: false }, axisLabel: { color: css("--muted"), fontSize: 11 }, splitLine: { lineStyle: { color: css("--grid"), width: 1 } } };
  const shade = h.drawdowns[key].map(([a, b]) => [{ xAxis: a }, { xAxis: b }]);
  const font = getComputedStyle(document.body).fontFamily;
  HCHART.setOption({
    animation: false,
    textStyle: { fontFamily: font, color: css("--ink-2") },
    legend: { top: 0, left: 0, icon: "roundRect", itemWidth: 14, itemHeight: 3, itemGap: 18, textStyle: { color: css("--ink-2"), fontSize: 12 },
      inactiveColor: css("--base"), inactiveBorderColor: css("--base"),
      data: [priceName, ...lines.map((l) => l[0])], selected: state.legend },
    axisPointer: { link: [{ xAxisIndex: "all" }], lineStyle: { color: css("--base") } },
    tooltip: { trigger: "axis", backgroundColor: css("--surface"), borderColor: css("--ring"), extraCssText: "box-shadow:0 8px 24px rgba(0,0,0,.14);border-radius:8px;",
      textStyle: { color: css("--ink"), fontSize: 12 }, valueFormatter: (v) => v == null ? "—" : fmt(v) },
    grid: [{ left: 48, right: 12, top: el.clientWidth < 560 ? 64 : 40, height: "26%" }, { left: 48, right: 12, top: "48%", bottom: 26 }],
    xAxis: [
      { type: "category", gridIndex: 0, data: h.dates, ...ax, axisLabel: { show: false }, splitLine: { show: false } },
      { type: "category", gridIndex: 1, data: h.dates, ...ax, splitLine: { show: false } },
    ],
    yAxis: [
      { type: logScale ? "log" : "value", gridIndex: 0, scale: true, ...ax, splitNumber: 3, axisLine: { show: false },
        axisLabel: { color: css("--muted"), fontSize: 11, formatter: axisFmt, showMinLabel: !logScale, showMaxLabel: false } },
      { type: "value", gridIndex: 1, min: 0, max: 100, interval: 20, ...ax, axisLine: { show: false } },
    ],
    dataZoom: [{ type: "inside", xAxisIndex: [0, 1], start: rangeStart(), end: 100 }],
    series: [
      { name: priceName, type: "line", xAxisIndex: 0, yAxisIndex: 0, data: h.prices[key], showSymbol: false, emphasis: { disabled: true },
        lineStyle: { width: 1.5, color: css("--ink-2") }, itemStyle: { color: css("--ink-2") },
        markArea: { silent: true, itemStyle: { color: css("--b1"), opacity: 0.10 }, data: shade } },
      ...lines.map(([name, data, c], i) => ({
        name, type: "line", xAxisIndex: 1, yAxisIndex: 1, data, showSymbol: false, emphasis: { disabled: true }, connectNulls: false,
        lineStyle: { width: 2, color: css(c), cap: "round", join: "round" }, itemStyle: { color: css(c) },
        ...(i === 0 ? { markArea: { silent: true, data: [
          [{ yAxis: 0, itemStyle: { color: css("--b1"), opacity: 0.06 } }, { yAxis: 20 }],
          [{ yAxis: 80, itemStyle: { color: css("--b5"), opacity: 0.06 } }, { yAxis: 100 }]] } } : {}),
      })),
    ],
  }, true);
}

/* ------------------------------------------------------------------ tables */
function sortable(table) {
  table.querySelectorAll("th[data-sort]").forEach((th) => th.addEventListener("click", () => {
    const col = th.cellIndex, dir = th.getAttribute("aria-sort") === "descending" ? 1 : -1;
    table.querySelectorAll("th[data-sort]").forEach((x) => x.removeAttribute("aria-sort"));
    th.setAttribute("aria-sort", dir === 1 ? "ascending" : "descending");
    const body = table.tBodies[0];
    const key = (tr) => { const td = tr.cells[col]; return td.dataset.v !== undefined ? Number(td.dataset.v) : td.textContent.trim().toLowerCase(); };
    [...body.rows].sort((a, b) => {
      const x = key(a), y = key(b);
      if (typeof x === "number" && typeof y === "number") return (x - y) * dir;
      if (typeof x === "number") return -1;
      if (typeof y === "number") return 1;
      return x < y ? -dir : x > y ? dir : 0;
    }).forEach((tr) => body.appendChild(tr));
  }));
}
function moreToggle(btnId, tableId) {
  const btn = document.getElementById(btnId), t = document.getElementById(tableId);
  btn.addEventListener("click", () => { t.classList.toggle("all"); btn.textContent = t.classList.contains("all") ? "Fewer columns" : "More columns"; });
}

function zbar(z, expensiveHigh) {
  if (!isNum(z)) return "";
  const c = Math.max(-3, Math.min(3, z)), w = Math.abs(c) / 3 * 50;
  const rich = expensiveHigh ? z > 0 : z < 0;
  return `<span class="zbar" aria-hidden="true"><b style="${c >= 0 ? "left:50%" : `left:${50 - w}%`};width:${w}%;border-radius:${c >= 0 ? "0 3px 3px 0" : "3px 0 0 3px"};background:${rich ? "var(--b1)" : "var(--b5)"}"></b></span>`;
}

function renderValuation(d) {
  const win = (r, k) => r.windows[k] || {};
  const z20 = (r) => win(r, "20y").z ?? win(r, "all").z;
  const p20 = (r) => win(r, "20y").pct ?? win(r, "all").pct;
  const rows = (d.valuation || []).map((r) => {
    const hi = r.expensive_when === "high";
    const unit = r.unit === "x" ? "x" : r.unit === "%" ? "%" : "";
    const fs = r.factset_10y_avg != null ? ` · FactSet's own 5y ${fmt(r.factset_5y_avg)}, 10y ${fmt(r.factset_10y_avg)}` : "";
    return `<tr><td class="name">${esc(r.label)}<small>${hi ? "Higher" : "Lower"} = more expensive · since ${r.since.slice(0, 4)}${fs}</small></td>
      <td class="r num"${dv(r.value)} title="${esc(r.source)} · as of ${r.as_of}">${fmt(r.value)}${unit}</td>
      <td class="r num opt"${dv(win(r, "5y").mean)}>${fmt(win(r, "5y").mean)}</td>
      <td class="r num"${dv(win(r, "10y").mean)}>${fmt(win(r, "10y").mean)}</td>
      <td class="r num"${dv(win(r, "20y").mean)}>${fmt(win(r, "20y").mean)}</td>
      <td class="r num opt"${dv(win(r, "all").mean)}>${fmt(win(r, "all").mean)}</td>
      <td class="r num"${dv(win(r, "10y").z)} title="Standard deviations from the 10-year average">${signed(win(r, "10y").z)} ${zbar(win(r, "10y").z, hi)}</td>
      <td class="r num opt"${dv(z20(r))}>${signed(z20(r))}${win(r, "20y").z == null && win(r, "all").z != null ? "*" : ""}</td>
      <td class="r num"${dv(p20(r))} title="Percentile within the last 20 years (or full history)">${fmt1(p20(r))}</td>
      <td class="num"${dv(Date.parse(r.as_of))}>${shortDate(r.as_of)}</td>
      <td><a href="${esc(r.source_url)}" target="_blank" rel="noopener" title="${esc(r.source)}">source</a></td></tr>`;
  }).join("");
  document.getElementById("valuation").innerHTML = `
    <div class="bhead"><h2>S&amp;P 500 valuation vs history</h2><span class="sub">display only · bars: red = expensive vs the 10-year average, blue = cheap</span></div>
    <div class="tablewrap"><table class="data" id="valtable"><thead><tr><th data-sort>Measure</th><th class="r" data-sort>Now</th><th class="r opt" data-sort>5y avg</th><th class="r" data-sort>10y avg</th><th class="r" data-sort>20y avg</th><th class="r opt" data-sort>Full history</th><th class="r" data-sort>z (10y)</th><th class="r opt" data-sort>z (20y)</th><th class="r" data-sort>Pctile (20y)</th><th data-sort>As of</th><th>Source</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="tblbar"><button class="linkbtn" id="valmore">More columns</button></div>
    <p class="note">The Phase 3 backtest keeps CAPE and equities/GDP out of the G2 score (their sign against later returns was wrong), so this panel shows stretch without weighting it. * = full-history z where 20 years are not available.</p>`;
  sortable(document.getElementById("valtable"));
  moreToggle("valmore", "valtable");
}

function renderAICos(d) {
  const cell = (v, opt = false) => `<td class="r num${opt ? " opt" : ""}"${dv(v)}>${pctS(v)}</td>`;
  const rows = (d.ai_companies || []).map((c) => `<tr><td><b>${esc(c.ticker)}</b></td><td class="ink2">${esc(human(c.layer))}</td>
    ${cell(c.ret_1w, true)}${cell(c.ret_1m)}${cell(c.ret_3m, true)}${cell(c.ret_ytd)}${cell(c.drawdown)}
    <td class="num opt"${c.release_date ? dv(Date.parse(c.release_date)) : ""}>${c.release_date ? shortDate(c.release_date) : "—"}</td>
    <td class="r num opt"${dv(c.quote_positivity)} title="Executives' quoted remarks: net positive finance words per 100 words (Loughran-McDonald)">${fmt1(c.quote_positivity)}</td>
    <td class="r num opt"${dv(c.ai_mentions)} title="AI mentions per 1,000 words of the release">${fmt1(c.ai_mentions)}</td>
    <td class="r num opt"${dv(c.rev_guide)} title="Next-quarter revenue guidance midpoint">${c.rev_guide == null ? "—" : "$" + fmt(c.rev_guide) + "M"}</td>

    <td class="num"${c.next_report ? dv(Date.parse(c.next_report)) : ""}>${c.next_report ? shortDate(c.next_report) : "—"}</td></tr>`).join("");
  document.getElementById("aicos").innerHTML = `
    <div class="bhead"><h2>AI companies</h2><span class="sub">performance, earnings and guidance · returns in local currency · as of ${dateLbl(d.as_of)} · click a column to sort</span></div>
    <div class="tablewrap"><table class="data" id="aitable"><thead><tr><th data-sort>Ticker</th><th data-sort>Layer</th><th class="r opt" data-sort>1W</th><th class="r" data-sort>1M</th><th class="r opt" data-sort>3M</th><th class="r" data-sort>YTD</th><th class="r" data-sort>From 52w high</th><th class="opt" data-sort>Last release</th><th class="r opt" data-sort>Leader tone</th><th class="r opt" data-sort>AI mentions</th><th class="r opt" data-sort>Revenue guide</th><th class="r opt" data-sort>Guide vs prior</th><th class="r" data-sort>EPS surprise</th><th class="r" data-sort>Revenue TTM YoY</th><th data-sort>Next report</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="tblbar"><button class="linkbtn" id="aimore">More columns</button></div>
    <p class="note">Earnings releases: SEC 8-K exhibit 99.1. Leader tone is a word count (Loughran-McDonald lists), not model output. Guidance appears only where a company states a numeric revenue outlook. EPS surprises: Finnhub (last 4 quarters). Revenue: SEC XBRL.</p>`;
  sortable(document.getElementById("aitable"));
  moreToggle("aimore", "aitable");
}

function renderWatchlist(d) {
  const rows = d.watchlist.map((w) => `<tr><td>${esc(w.entity)}<small class="muted" style="display:block;font-size:11.5px">${esc(w.kpi)}</small></td>
    <td>${esc(human(w.metric || "—"))}${w.basis ? ` <span class="muted">(${esc(w.basis)})</span>` : ""}</td>
    <td class="r num"${dv(w.value)} title="${esc(w.note || "")}">${esc(typeof w.value === "number" ? fmt(w.value) : w.value)}</td><td>${esc(w.period)}</td>
    <td class="num">${shortDate(w.as_of)}</td><td><span class="ink2">${esc(w.status)}</span></td><td><a href="${esc(w.source_url)}" target="_blank" rel="noopener">source</a></td></tr>`).join("");
  document.getElementById("watchlist").innerHTML = `
    <div class="bhead"><h2>Watch list</h2><span class="sub">manual KPIs from config/events.yaml</span></div>
    <div class="tablewrap"><table class="data" id="wltable"><thead><tr><th data-sort>Entity</th><th data-sort>Metric</th><th class="r" data-sort>Value</th><th data-sort>Period</th><th data-sort>As of</th><th data-sort>Status</th><th>Source</th></tr></thead><tbody>${rows || `<tr><td colspan="7" class="muted">No entries yet.</td></tr>`}</tbody></table></div>
    <p class="note">Each entry needs a source URL and a status, which sets its weight: primary 1.0 · guidance 0.8 · secondhand 0.6 · estimate 0.3.${d.events_rejected.length ? ` <b>${d.events_rejected.length} entries rejected by schema.</b>` : ""}</p>
    <p class="note">Watching: Anthropic Q4 dollar add and S-1, OpenAI run rate (net basis), capex framing after the late-October prints, rate limits vs growth, Ramp and Menlo shares, open-weight token share, customer insourcing, HBM/DRAM contract prices.</p>`;
  sortable(document.getElementById("wltable"));
}

const KINDS = { fomc: "FOMC", macro: "Macro", earnings: "Earnings" };
function renderLists(d) {
  const cats = d.catalysts, cap = 10;
  const row = (c) => `<div class="lrow"><span class="when">${dayDate(c.date)}</span>
      <span><a href="${esc(c.source_url)}" target="_blank" rel="noopener" style="color:var(--ink)">${esc(c.label)}</a> <span class="k">· ${esc(c.detail || KINDS[c.kind] || human(c.kind))}</span></span></div>`;
  const el = document.getElementById("catalysts");
  const draw = (all) => {
    el.innerHTML = (cats.length ? (all ? cats : cats.slice(0, cap)).map(row).join("") : `<p class="muted">Nothing in the next 30 days.</p>`)
      + (cats.length > cap ? `<div class="tblbar"><button class="linkbtn" id="catmore">${all ? "Show fewer" : `Show all ${cats.length}`}</button></div>` : "");
    const b = document.getElementById("catmore");
    if (b) b.addEventListener("click", () => draw(!all));
  };
  draw(false);
  document.getElementById("movers").innerHTML = d.movers.map((m) => `<div class="lrow" style="grid-template-columns:minmax(0,1fr) 64px 48px">
      <span>${esc(m.name)} <span class="muted">· ${m.gauge}</span></span><span class="num" style="text-align:right" title="Score change over 5 trading days">${signed(m.change_1w)}</span>
      <span class="num muted" style="text-align:right" title="Score now">${fmt1(m.score)}</span></div>`).join("") || `<p class="muted">No moves.</p>`;
}

/* ------------------------------------------------------------- methodology */
function renderMethod(d) {
  const m = d.methodology;
  const gaugeRows = Object.entries(m.gauges).map(([id, g]) => `<tr><td>${id}</td><td>${esc(g.name)}</td><td class="name">${Object.entries(g.pillars).map(([p, w]) => `${esc(pname(p))} ${w}`).join(" · ")}</td><td class="name">${g.scale.map(esc).join(" → ")}</td></tr>`).join("");
  document.getElementById("tab-method").innerHTML = `
    <h2>How the gauges work</h2>
    <ul>${Object.values(m.rules).map((r) => `<li>${esc(r)}</li>`).join("")}</ul>
    <p class="note">Bands: 0–20, 20–40, 40–60, 60–80, 80–100. Full backtest: <a href="../reports/validation.md">reports/validation.md</a>. Sentiment composites are mostly coincident and contrarian at extremes; downside risk is carried by the fragility overlay and the G1/G2 divergence banners.</p>
    <h2>Gauges and pillar weights</h2>
    <div class="tablewrap"><table class="data"><thead><tr><th>Gauge</th><th>Name</th><th>Pillars (weight)</th><th>Scale</th></tr></thead><tbody>${gaugeRows}</tbody></table></div>
    <h2>Indicators <select id="mfilter" aria-label="Filter by gauge"><option value="">All gauges</option>${Object.keys(m.gauges).map((g) => `<option>${g}</option>`).join("")}</select></h2>
    <div class="tablewrap"><table class="data"><thead><tr><th>Indicator</th><th>Gauge</th><th>Pillar</th><th>Role</th><th>Direction</th><th class="r">Weight</th><th>Freq</th><th>Window</th><th>Inputs / method</th><th>Notes</th></tr></thead><tbody id="mbody"></tbody></table></div>`;
  const fill = () => {
    const f = document.getElementById("mfilter").value;
    document.getElementById("mbody").innerHTML = m.indicators.filter((i) => !f || i.gauge === f).map((i) => `<tr class="${i.role === "display" || i.weight === 0 ? "inactive" : ""}">
      <td class="name">${esc(i.name)}<small>${i.id} · ${i.kind}${i.cnn ? " · CNN row" : ""}${i.fragility ? " · fragility: " + i.fragility.replaceAll("_", " ") : ""}</small></td>
      <td>${i.gauge}</td><td>${esc(pname(i.pillar))}</td><td>${i.role}</td><td>${i.direction.replaceAll("_", " ")}</td><td class="r num">${i.weight}</td><td>${i.expected_freq}</td><td>${i.lookback}</td>
      <td class="name">${esc(i.inputs.join(" + ") || i.transform)}${i.inputs.length && i.transform !== "identity" ? " → " + esc(i.transform) : ""}</td>
      <td class="name muted" style="min-width:260px">${esc(i.notes || "")}${i.validation ? `<br><b>${esc(i.validation)}</b>` : ""}</td></tr>`).join("");
  };
  document.getElementById("mfilter").addEventListener("change", fill);
  fill();
}

function renderFooter(d) {
  document.getElementById("footer").innerHTML = d.attribution.map((a) => `<p>${esc(a)}</p>`).join("") +
    `<p>Built ${esc(new Date(d.generated_at).toISOString().replace("T", " ").slice(0, 16))} UTC from data/latest.json. Not investment advice.</p>`;
}

/* -------------------------------------------------------------------- boot */
function renderAll() {
  const d = LATEST;
  renderMeta(d); renderAlerts(d); renderOverview(d); renderDetail(); renderSignals(d);
  renderHistMode(); renderValuation(d); renderAICos(d); renderLists(d); renderWatchlist(d);
  renderMethod(d); renderFooter(d);
  renderHistory();
}

function setupTabs() {
  document.querySelectorAll(".tabs [data-tab]").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll(".tabs [data-tab]").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
    document.getElementById("tab-dash").hidden = b.dataset.tab !== "dash";
    document.getElementById("tab-method").hidden = b.dataset.tab !== "method";
    if (b.dataset.tab === "dash" && HCHART) HCHART.resize();
  }));
  document.addEventListener("click", (e) => {
    const pop = document.getElementById("issues");
    if (pop && pop.open && !pop.contains(e.target)) pop.open = false;
  });
}

(async function main() {
  setupTabs();
  const hash = location.hash.slice(1);
  if (GAUGE_IDS.includes(hash)) state.gauge = hash;
  if (hash === "method") document.querySelector('.tabs [data-tab="method"]').click();
  try {
    [LATEST, HISTORY] = await Promise.all([load("latest.json"), load("history.json")]);
  } catch (e) {
    document.getElementById("tab-dash").innerHTML = `<div class="err">${esc(e.message)}. Run <code>make refresh</code> to build data/latest.json.</div>`;
    document.getElementById("meta").textContent = "";
    return;
  }
  renderAll();
  let t;
  window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => HCHART && HCHART.resize(), 120); });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderHistory);
})();
</script>
