<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Gauges</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 22a12 12 0 0 1 24 0' fill='none' stroke='%232a78d6' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M16 22l6-8' stroke='%230b0b0b' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
  try { const t = localStorage.getItem("mg-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) { /* storage blocked */ }
</script>
<style>
/* Zones z1..z5 are a diverging scale: fear (red) <- neutral gray -> complacency (blue). */
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --wash: #f1f0ec;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --base: #c3c2b7; --ring: rgba(11, 11, 11, .10);
  --link: #256abf;
  --z1: #c9403e; --z2: #ee9a92; --z3: #bdbbb2; --z4: #86b6ef; --z5: #256abf;
  --s1: #2a78d6; --s2: #eb6834;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --wash: #242422;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --base: #383835; --ring: rgba(255, 255, 255, .10);
    --link: #6da7ec;
    --z1: #ee6b67; --z2: #8f3f3c; --z3: #4a4945; --z4: #1c5cab; --z5: #6da7ec;
    --s1: #3987e5; --s2: #d95926;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --wash: #242422;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --base: #383835; --ring: rgba(255, 255, 255, .10);
  --link: #6da7ec;
  --z1: #ee6b67; --z2: #8f3f3c; --z3: #4a4945; --z4: #1c5cab; --z5: #6da7ec;
  --s1: #3987e5; --s2: #d95926;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
.num, td, th { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .ink2 { color: var(--ink-2); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 4px; }

header.top { border-bottom: 1px solid var(--grid); }
.bar { display: flex; align-items: center; gap: 6px 16px; flex-wrap: wrap; padding: 12px 16px; }
.brand { font-weight: 650; font-size: 15px; letter-spacing: -.01em; }
.meta { margin-left: auto; display: flex; align-items: center; gap: 4px 12px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; }
.meta b { color: var(--ink-2); font-weight: 550; }
.btn { background: none; border: 1px solid var(--grid); border-radius: 6px; padding: 3px 9px; cursor: pointer; color: var(--ink-2); font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--wash); }
details.pop { position: relative; }
details.pop > summary { list-style: none; cursor: pointer; } details.pop > summary::-webkit-details-marker { display: none; }
details.pop .panel { position: absolute; right: 0; top: 30px; width: min(400px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .16); z-index: 30; color: var(--ink); font-size: 12.5px; }
.panel ul { margin: 0; padding: 0; list-style: none; } .panel li { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; }
.panel li .nm { flex: 1; min-width: 0; } .panel li small { color: var(--muted); display: block; word-break: break-word; }
.sdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
.sdot.good { background: var(--good); } .sdot.warning { background: var(--warning); } .sdot.critical { background: var(--critical); }

main { padding: 20px 0 56px; }
.lede { color: var(--ink-2); font-size: 13px; margin: 0 0 16px; max-width: 760px; }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 16px 18px 14px; cursor: pointer; text-align: left; min-width: 0; display: flex; flex-direction: column; transition: border-color .12s; }
.tile:hover { border-color: var(--base); }
.tile[aria-expanded="true"] { border-color: var(--ink-2); box-shadow: 0 0 0 1px var(--ink-2); }
.tname { font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.tname small { font-weight: 400; color: var(--muted); font-size: 12px; white-space: nowrap; }
.readout { display: flex; align-items: baseline; gap: 10px; margin: 10px 0 12px; flex-wrap: wrap; }
.val { font-size: 40px; font-weight: 650; letter-spacing: -.025em; line-height: 1; }
.val small { font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 2px; }
.zone { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.chip { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--ink); white-space: nowrap; }
.chip.quiet { border-color: var(--grid); color: var(--muted); font-weight: 500; }
.scale { position: relative; display: grid; gap: 2px; height: 6px; grid-template-columns: 10fr 15fr 50fr 15fr 10fr; }
.scale i:first-child { border-radius: 3px 0 0 3px; } .scale i:last-child { border-radius: 0 3px 3px 0; }
.scale .mark { position: absolute; top: -5px; width: 3px; height: 16px; border-radius: 2px; background: var(--ink); transform: translateX(-50%); box-shadow: 0 0 0 2px var(--surface); }
.ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 5px; }
.odds1 { font-size: 13px; color: var(--ink-2); margin-top: 12px; min-height: 58px; }
.odds1 b { color: var(--ink); font-weight: 600; }
.tfoot { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; margin-top: auto; padding-top: 10px; font-size: 12px; color: var(--muted); }
.tfoot .d span { margin-right: 10px; white-space: nowrap; } .tfoot .d b { font-weight: 400; color: var(--ink-2); }
.spark { width: 92px; height: 26px; flex: none; } .spark svg { display: block; width: 100%; height: 100%; overflow: visible; }
.more { font-size: 12px; color: var(--link); white-space: nowrap; }

/* Detail */
.detail { margin-top: 28px; }
.dhead { display: flex; align-items: baseline; gap: 8px 14px; flex-wrap: wrap; margin-bottom: 4px; }
.dhead h2 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
.dhead .x { margin-left: auto; }
.dsub { color: var(--ink-2); font-size: 13px; margin: 0 0 20px; max-width: 820px; }
.dsub b { color: var(--ink); font-weight: 600; }
section.blk { margin-top: 28px; }
.bh { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; margin-bottom: 10px; }
.bh h3 { font-size: 14px; margin: 0; font-weight: 650; }
.bh .sub { color: var(--muted); font-size: 12.5px; }
.bh .right { margin-left: auto; }
.note { color: var(--muted); font-size: 12px; margin: 8px 0 0; max-width: 860px; }
.seg { display: inline-flex; background: var(--wash); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { background: none; border: 0; padding: 3px 10px; border-radius: 6px; cursor: pointer; color: var(--ink-2); font-size: 12.5px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--ring); font-weight: 550; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: right; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 12px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td { text-align: right; padding: 8px 12px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
tr:last-child > td { border-bottom: 0; }
td small { display: block; color: var(--muted); font-size: 11.5px; }
tr.now > td { background: var(--wash); }
tr.now > td:first-child { box-shadow: inset 3px 0 0 var(--ink); }
tr.allrow > td { color: var(--ink-2); border-top: 1px solid var(--base); }
th.sortable { cursor: pointer; } th.sortable:hover { color: var(--ink); }
.zl { display: inline-flex; align-items: center; gap: 7px; font-weight: 550; }
.zl small { display: inline; font-weight: 400; margin-left: 2px; }
.ev { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
.evc { padding: 12px 14px; font-size: 13px; color: var(--ink-2); }
.evc h4 { margin: 0 0 4px; font-size: 13px; color: var(--ink); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dots { letter-spacing: 1px; font-size: 11px; color: var(--ink); } .dots i { font-style: normal; color: var(--base); }
.grade { font-size: 11.5px; font-weight: 550; color: var(--ink-2); }
.chart { width: 100%; height: 440px; } .chart.sm { height: 220px; } .chart.md { height: 300px; }
.legend { display: flex; gap: 4px 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); padding: 0 14px 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .ln { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }

/* Indicator rows */
tr.ind { cursor: pointer; } tr.ind:hover > td { background: var(--wash); }
tr.ind td:first-child { white-space: normal; min-width: 210px; }
tr.grp > td { background: none; color: var(--muted); font-size: 12px; font-weight: 600; padding-top: 14px; border-bottom: 1px solid var(--grid); text-align: left; }
.pos { position: relative; width: 120px; height: 6px; background: linear-gradient(90deg, var(--z1) 0 10%, var(--z2) 10% 25%, var(--z3) 25% 75%, var(--z4) 75% 90%, var(--z5) 90%); border-radius: 3px; display: inline-block; vertical-align: middle; }
.pos .mark { position: absolute; top: -4px; width: 3px; height: 14px; border-radius: 2px; background: var(--ink); transform: translateX(-50%); box-shadow: 0 0 0 2px var(--surface); }
.car { display: inline-block; width: 10px; color: var(--muted); transition: transform .12s; } tr.open .car { transform: rotate(90deg); }
tr.exp > td { white-space: normal; text-align: left; background: var(--wash); padding: 14px 16px 16px; }
.expg { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 20px; }
.expg p { margin: 0 0 8px; font-size: 13px; color: var(--ink-2); max-width: 520px; } .expg p b { color: var(--ink); font-weight: 600; }
.mini { font-size: 12.5px; margin-top: 6px; } .mini th, .mini td { padding: 5px 8px; background: none !important; }
.badge { font-size: 11px; color: var(--muted); border: 1px solid var(--grid); border-radius: 4px; padding: 0 5px; margin-left: 6px; white-space: nowrap; }
details.fold { margin-top: 28px; }
details.fold > summary { cursor: pointer; font-size: 14px; font-weight: 650; list-style: none; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "›"; display: inline-block; width: 10px; color: var(--muted); transition: transform .12s; }
details.fold[open] > summary::before { transform: rotate(90deg); }
details.fold > summary .sub { font-weight: 400; color: var(--muted); font-size: 12.5px; }
details.fold > .inner { margin-top: 10px; }
.pos-t { color: var(--ink); } .neg-t { color: var(--ink); }
.cat { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 4px 12px; font-size: 13px; padding: 12px 14px; }
.cat .d { color: var(--muted); }
.kv { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kv > div { padding: 12px 14px; } .kv .k { font-size: 12px; color: var(--muted); } .kv .v { font-size: 22px; font-weight: 650; letter-spacing: -.02em; } .kv .s { font-size: 12px; color: var(--ink-2); }
footer { margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; }
footer p { margin: 0 0 8px; max-width: 860px; }
.empty { padding: 40px 0; color: var(--muted); }
@media (max-width: 860px) {
  .tiles { grid-template-columns: 1fr; } .odds1 { min-height: 0; }
  .ev, .expg { grid-template-columns: 1fr; } .kv { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .chart { height: 380px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <div class="brand">Market Gauges</div>
    <div class="meta">
      <span id="asof"></span>
      <details class="pop" id="srcpop"><summary class="btn"><span class="sdot" id="srcdot"></span><span id="srclbl">Sources</span></summary><div class="panel" id="srcpanel"></div></details>
      <button class="btn" id="theme" type="button" aria-label="Switch between light and dark">Theme</button>
    </div>
  </div>
</header>
<main class="wrap">
  <p class="lede" id="lede">Contrarian gauges. 0 is extreme fear, historically the time to buy; 100 is complacency. Each one shows what the market actually did after readings like today's. Select a gauge for the detail.</p>
  <div class="tiles" id="tiles"><div class="empty">Loading…</div></div>
  <div class="detail" id="detail" hidden></div>
  <footer id="foot"></footer>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const ZC = { buy: "--z1", fear: "--z2", neutral: "--z3", calm: "--z4", caution: "--z5" };
const HZ = ["1m", "3m", "6m", "12m"];
const HNAME = { "1m": "1 month", "3m": "3 months", "6m": "6 months", "12m": "12 months" };
const GRADE = { strong: [3, "Strong evidence"], moderate: [2, "Moderate evidence"], weak: [1, "Weak evidence"], none: [0, "No edge found"] };
let D = null, H = null, jump = false, view = null, range = "5Y", openInd = null, charts = [], sortKey = null, sortDir = -1, epSide = "buy";

const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sgn = (v, nd = 1, suf = "%") => v == null ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(nd) + suf;
const fdate = (s, o = { month: "short", day: "numeric", year: "numeric" }) => s ? new Date(s + "T12:00:00").toLocaleDateString("en-US", o) : "—";
const fval = (i, v = i.value) => v == null ? "—" : (v < 0 ? "−" : "") + Math.abs(v).toFixed(i.nd) + (i.unit === "x" ? "×" : i.unit === "%" ? "%" : i.unit === "pts" ? " pts" : "");
const sw = key => `<i class="sw" style="background:var(${ZC[key]})"></i>`;
const dots = g => { const n = (GRADE[g] || GRADE.none)[0]; return `<span class="dots" aria-hidden="true">${"●".repeat(n)}<i>${"●".repeat(3 - n)}</i></span> <span class="grade">${(GRADE[g] || GRADE.none)[1]}</span>`; };
const bname = g => g.id === "ai" ? "the semiconductor index" : "the S&P 500";
const signal = z => z.key === "buy" ? `<span class="chip">Buy zone</span>` : z.key === "caution" ? `<span class="chip">Caution zone</span>` : `<span class="chip quiet">No signal</span>`;

function spark(vals) {
  if (!vals || vals.length < 2) return "";
  const w = 92, h = 26, x = i => i / (vals.length - 1) * w, y = v => h - 2 - v / 100 * (h - 4);
  const d = vals.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join("");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Score, last 6 months"><line x1="0" x2="${w}" y1="${y(10)}" y2="${y(10)}" stroke="var(--z1)" stroke-width="1" stroke-dasharray="2 3"/><line x1="0" x2="${w}" y1="${y(90)}" y2="${y(90)}" stroke="var(--z5)" stroke-width="1" stroke-dasharray="2 3"/><path d="${d}" fill="none" stroke="var(--ink)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}

function oddsLine(g) {
  const z = g.now.zone.h["3m"], b = g.now.base["3m"];
  if (!z) return "Too few past readings in this zone to say.";
  return `After readings like this, ${esc(bname(g))} was higher 3 months later <b>${z.hit}%</b> of the time, median <b>${sgn(z.median)}</b>. <span class="muted">Any day: ${b.hit}%, ${sgn(b.median)}.</span>`;
}

function gaugeTile(g, sub) {
  return `<button class="tile" type="button" data-view="${g.id}" aria-expanded="${view === g.id}">
    <div class="tname"><span>${esc(g.name)}</span><small>${sub}</small></div>
    <div class="readout"><span class="val num">${g.score.toFixed(0)}<small>/100</small></span><span class="zone">${sw(g.zone.key)}${esc(g.zone.label)}</span>${signal(g.zone)}</div>
    <div class="scale" aria-hidden="true">${Object.values(ZC).map(c => `<i style="background:var(${c})"></i>`).join("")}<span class="mark" style="left:${g.score}%"></span></div>
    <div class="ends"><span>Extreme fear · buy</span><span>Complacent · caution</span></div>
    <div class="odds1">${oddsLine(g)}</div>
    <div class="tfoot"><div class="d"><span><b>1D</b> ${sgn(g.chg.d1, 0, "")}</span><span><b>1W</b> ${sgn(g.chg.w1, 0, "")}</span><span><b>1M</b> ${sgn(g.chg.m1, 0, "")}</span></div><div class="spark">${spark(g.spark)}</div></div>
  </button>`;
}

function ltTile(L) {
  if (!L) return `<div class="tile" style="cursor:default"><div class="tname"><span>Next 10 years</span></div><div class="odds1">Long-term model unavailable (see Sources).</div></div>`;
  const e = L.expected;
  return `<button class="tile" type="button" data-view="lt" aria-expanded="${view === "lt"}">
    <div class="tname"><span>S&amp;P 500 · next 10 years</span><small>valuation, not timing</small></div>
    <div class="readout"><span class="val num">${sgn(e.mid)}<small>a year</small></span><span class="zone">${esc(L.zone)}</span></div>
    <div class="odds1">Expected return implied by valuation. The two models say <b>${sgn(e.low)}</b> and <b>${sgn(e.high)}</b> a year. <span class="muted">Long-run average ${sgn(L.hist_avg)}${L.treasury10 != null ? `; a 10-year Treasury yields ${L.treasury10.toFixed(1)}%` : ""}.</span></div>
    <div class="tfoot"><div class="d">${L.models.map(m => `<span><b>${esc(m.name.replace("Investor ", "").replace("Shiller ", ""))}</b> ${m.pct.toFixed(0)}th pct</span>`).join("")}</div></div>
  </button>`;
}

function renderTiles() {
  $("#tiles").innerHTML = gaugeTile(D.gauges.spx, "next 1–12 months") + gaugeTile(D.gauges.ai, "next 1–12 months") + ltTile(D.longterm);
  document.querySelectorAll(".tile[data-view]").forEach(b => b.onclick = () => { jump = view !== b.dataset.view; location.hash = view === b.dataset.view ? "" : b.dataset.view; });
}

/* ---------------------------------------------------------------- detail */
function oddsTable(g) {
  const cell = s => s ? `<td title="Average ${sgn(s.mean)} · middle 80% of outcomes ${sgn(s.p10)} to ${sgn(s.p90)} · ${s.n.toLocaleString()} days">${sgn(s.median)}<small>${s.hit}% up</small></td>` : `<td class="muted">—</td>`;
  const rows = g.odds.zones.map(z => `<tr class="${z.key === g.zone.key ? "now" : ""}"><td><span class="zl">${sw(z.key)}${esc(z.label)} <small class="muted">${z.lo}–${z.hi}</small></span>${z.key === g.zone.key ? `<span class="badge">now</span>` : ""}</td><td>${z.episodes}<small>${z.days.toLocaleString()} days</small></td>${HZ.map(h => cell(z.h[h])).join("")}</tr>`).join("");
  return `<div class="card scroll"><table><thead><tr><th>Score zone</th><th>Episodes</th>${HZ.map(h => `<th>${HNAME[h]} later</th>`).join("")}</tr></thead><tbody>${rows}<tr class="allrow"><td>Any day</td><td><small>${g.odds.days.toLocaleString()} days</small></td>${HZ.map(h => cell(g.odds.base[h])).join("")}</tr></tbody></table></div>
  <p class="note">Median price return of ${esc(bname(g))} after every day the score sat in each zone, and how often it was positive, since ${fdate(g.odds.since, { year: "numeric" })}. Hover a cell for the average and the range. Windows overlap, so days within an episode are not independent: the episode count is the honest sample size.</p>`;
}

function evCard(title, e, want, benchmark) {
  const h = e.h["3m"];
  if (!h) return "";
  const dir = want === "above" ? "beat" : "lagged";
  const ok = want === "above" ? h.excess > 0 : h.excess < 0;
  const halves = h.pre != null && h.post != null ? ` Before 2010: ${sgn(h.pre, 1, "")} pts; since: ${sgn(h.post, 1, "")} pts.` : h.post != null ? ` All of this history is after 2008.` : "";
  const p = e.p == null ? "" : ` Chance of a gap this large by luck: ${e.p < 0.01 ? "under 1%" : Math.round(e.p * 100) + "%"}.`;
  return `<div class="card evc"><h4>${title} ${dots(e.grade)}</h4>${e.episodes} episodes. Three months later ${esc(benchmark)} ${ok ? dir : "did not " + (want === "above" ? "beat" : "lag")} its average by ${Math.abs(h.excess).toFixed(1)} points (${sgn(h.mean)} vs ${sgn(h.base_mean)}), up ${h.hit}% of the time vs ${h.base_hit}%.${halves}${p}</div>`;
}

function indRow(i, cols) {
  const open = openInd === i.id;
  const stale = i.stale ? `<span class="badge">stale</span>` : "";
  let h = `<tr class="ind ${open ? "open" : ""}" data-ind="${i.id}" tabindex="0" aria-expanded="${open}"><td><span class="car">›</span> ${esc(i.name)}${stale}</td><td>${fval(i)}</td><td>${i.score == null ? "—" : `<span class="pos" title="${i.score.toFixed(0)} of 100 (0 = most fearful reading in its history)"><span class="mark" style="left:${i.score}%"></span></span>`}</td><td>${i.score == null ? "—" : i.score.toFixed(0)}</td><td>${i.evidence ? dots(i.evidence.fear.grade) : `<span class="muted">short history</span>`}</td><td class="muted">${fdate(i.as_of, { month: "short", day: "numeric" })}</td></tr>`;
  if (open) h += `<tr class="exp"><td colspan="${cols}">${indDetail(i)}</td></tr>`;
  return h;
}

function indDetail(i) {
  const e = i.evidence;
  let ev = `<p class="muted">Not enough history to test on its own.</p>`;
  if (e) {
    const row = (lab, s) => `<tr><td style="white-space:normal">${lab}<small>${s.episodes} episodes · ${dots(s.grade)}</small></td>${HZ.map(h => s.h[h] ? `<td title="${sgn(s.h[h].mean)} vs ${sgn(s.h[h].base_mean)} on any day">${sgn(s.h[h].excess, 1, "")}<small>${s.h[h].hit}% up</small></td>` : "<td>—</td>").join("")}</tr>`;
    ev = `<div class="scroll"><table class="mini"><thead><tr><th>Return vs average, in points</th>${HZ.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${row("Most fearful 10% of readings", e.fear)}${row("Calmest 10% of readings", e.calm)}</tbody></table></div>`;
  }
  return `<div class="expg"><div><p><b>What it is.</b> ${esc(i.what)}</p><p><b>${i.role === "scored" ? "Why it is in the score." : "Why it is not in the score."}</b> ${esc(i.why)}</p>${ev}<p class="muted" style="margin-top:8px">${i.fear === "low" ? "Low readings mean fear. " : "High readings mean fear. "}History from ${fdate(i.since, { year: "numeric" })}. Source: ${esc(i.source)}.</p></div><div><div class="chart sm" id="indchart"></div></div></div>`;
}

function indTable(g, role) {
  const list = g.indicators.filter(i => i.role === role), cols = 6;
  let body = "";
  if (role === "scored") for (const p of g.pillars) body += `<tr class="grp"><td colspan="${cols}">${esc(p.name)} · ${p.score.toFixed(0)}</td></tr>` + list.filter(i => i.pillar === p.name).map(i => indRow(i, cols)).join("");
  else body = list.map(i => indRow(i, cols)).join("");
  return `<div class="card scroll"><table><thead><tr><th>${role === "scored" ? "Input" : "Metric"}</th><th>Now</th><th>Fear ← → Calm</th><th>Rank</th><th>Evidence as a buy signal</th><th>As of</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

function episodesTable(g) {
  const list = g.episodes[epSide] || [];
  const c = v => v == null ? `<td class="muted">—</td>` : `<td>${sgn(v)}</td>`;
  const rows = list.map(e => `<tr><td>${fdate(e.start)}${e.open ? `<span class="badge">open</span>` : ""}</td><td>${e.days}</td><td>${e.extreme.toFixed(0)}</td>${HZ.map(h => c(e[h])).join("")}<td>${sgn(e.worst)}</td></tr>`).join("");
  return `<div class="card scroll" style="max-height:420px;overflow-y:auto"><table><thead><tr><th>First day in zone</th><th>Days</th><th>${epSide === "buy" ? "Lowest" : "Highest"} score</th>${HZ.map(h => `<th>+${h}</th>`).join("")}<th>Worst point, next 6m</th></tr></thead><tbody>${rows || `<tr><td colspan="8" class="muted">None yet.</td></tr>`}</tbody></table></div>
  <p class="note">Price return of ${esc(bname(g))} from the close of the first day in the zone. Visits less than a month apart count as one episode. "Worst point" is the lowest close over the following six months, relative to that first day.</p>`;
}

function aiContext() {
  const A = D.ai_context || {}, rows = (A.companies || []).slice();
  if (sortKey) rows.sort((a, b) => { const x = a[sortKey], y = b[sortKey]; if (x == null) return 1; if (y == null) return -1; return (x > y ? 1 : x < y ? -1 : 0) * sortDir; });
  const cols = [["ticker", "Ticker"], ["layer", "Layer"], ["ret_1w", "1W"], ["ret_1m", "1M"], ["ret_3m", "3M"], ["ret_ytd", "YTD"], ["from_high", "From 52w high"], ["eps_surprise", "EPS surprise"], ["rev_growth", "Revenue TTM YoY"], ["next_report", "Next report"]];
  const cell = (k, v) => v == null ? `<td class="muted">—</td>` : k === "ticker" ? `<td><b>${esc(v)}</b></td>` : k === "layer" ? `<td style="text-align:left" class="ink2">${esc(v)}</td>` : k === "next_report" ? `<td>${fdate(v, { month: "short", day: "numeric" })}</td>` : `<td>${sgn(v)}</td>`;
  const tbl = rows.length ? `<div class="card scroll"><table><thead><tr>${cols.map(([k, n]) => `<th class="sortable" data-sort="${k}" style="${k === "layer" ? "text-align:left" : ""}">${n}${sortKey === k ? (sortDir > 0 ? " ↑" : " ↓") : ""}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${cols.map(([k]) => cell(k, r[k])).join("")}</tr>`).join("")}</tbody></table></div><p class="note">Price returns in local currency (Yahoo). EPS surprise for the latest quarter and trailing revenue growth from Finnhub (US listings only). None of this feeds the score.</p>` : `<p class="note">No company data.</p>`;
  const cats = (A.catalysts || []).length ? `<div class="card cat">${A.catalysts.map(c => `<span class="d">${fdate(c.date, { weekday: "short", month: "short", day: "numeric" })}</span><span>${esc(c.label)}</span>`).join("")}</div>` : `<p class="note">Nothing scheduled in the next 30 days.</p>`;
  const g = A.gpu_spot;
  const gpu = g ? `<div class="card"><div class="chart sm" id="gpuchart"></div></div><p class="note">Equal-weight index of Nebius pre-emptible GPU spot prices (${g.series} platform and region series; 100 = ${fdate(g.since)}). Now ${g.value.toFixed(0)}${g.chg_1w != null ? `, ${sgn(g.chg_1w)} over a week` : ""}. Falling prices mean spare compute. Only ${g.days} days of history, so it cannot be tested yet and is not in the score.</p>` : `<p class="note">No GPU spot data.</p>`;
  return `<details class="fold" data-fold="co"><summary>AI companies <span class="sub">${rows.length} names · performance and earnings</span></summary><div class="inner">${tbl}</div></details>
  <details class="fold" data-fold="cat"><summary>Catalysts <span class="sub">next 30 days</span></summary><div class="inner">${cats}</div></details>
  <details class="fold" data-fold="gpu"><summary>GPU spot prices <span class="sub">compute demand, context only</span></summary><div class="inner">${gpu}</div></details>`;
}

const folds = new Set();
function gaugeDetail(g) {
  const cov = g.coverage.live < g.coverage.of ? ` Only ${g.coverage.live} of ${g.coverage.of} inputs are live.` : "";
  const z3 = g.now.zone.h["3m"];
  return `<div class="dhead"><h2>${esc(g.name)}</h2><span class="zone">${sw(g.zone.key)}${g.score.toFixed(1)} · ${esc(g.zone.label)}</span>${signal(g.zone)}<a class="x" href="#">Close</a></div>
  <p class="dsub">${g.zone_days} session${g.zone_days === 1 ? "" : "s"} in this zone. ${esc(g.benchmark)} ${g.price.toLocaleString()}, ${sgn(g.price_chg.d1, 2)} on the day, ${sgn(g.price_chg.from_high)} from its 52-week high.${cov}${z3 ? ` In this zone the middle 80% of 3-month outcomes ran from <b>${sgn(z3.p10)}</b> to <b>${sgn(z3.p90)}</b>.` : ""}</p>
  <section class="blk" style="margin-top:0"><div class="bh"><h3>What happened next</h3><span class="sub">every day since ${fdate(g.odds.since, { year: "numeric" })}, grouped by score</span></div>${oddsTable(g)}
    <div class="ev">${evCard("Buy side · score 10 or lower", g.evidence.fear, "above", bname(g))}${evCard("Sell side · score 90 or higher", g.evidence.calm, "below", bname(g))}</div></section>
  <section class="blk"><div class="bh"><h3>History</h3><span class="sub">score above, ${esc(bname(g))} below</span><div class="right seg" id="rangeseg">${["1Y", "5Y", "10Y", "Max"].map(r => `<button type="button" aria-pressed="${r === range}" data-range="${r}">${r}</button>`).join("")}</div></div>
    <div class="card"><div class="chart" id="hist"></div><div class="legend"><span><i class="sw" style="background:var(--z1);opacity:.45"></i>Buy zone (score ≤ 10)</span><span><i class="sw" style="background:var(--z5);opacity:.45"></i>Caution zone (score ≥ 90)</span><span><i class="sw" style="background:var(--z1);opacity:.3"></i>On the price chart: days spent in the buy zone</span></div></div></section>
  <section class="blk"><div class="bh"><h3>What is in the score</h3><span class="sub">${g.coverage.of} inputs, each ranked against its own history · select a row for its chart and its own track record</span></div>${indTable(g, "scored")}
    <p class="note">Rank: 0 is the most fearful reading in the input's history up to that day, 100 the calmest. The score averages the ranks within each group, then the groups, and ranks the result the same way. An input's own evidence can be weak while the combination is strong: single inputs are noisy.</p></section>
  <details class="fold" data-fold="ctx" ${folds.has("ctx") ? "open" : ""}><summary>Tested, not scored <span class="sub">${g.indicators.filter(i => i.role === "context").length} metrics, with the reason each was left out</span></summary><div class="inner">${indTable(g, "context")}</div></details>
  <details class="fold" data-fold="ep" ${folds.has("ep") ? "open" : ""}><summary>Past signals <span class="sub">${g.episodes.buy.length} buy-zone and ${g.episodes.caution.length} caution-zone episodes</span></summary><div class="inner"><div class="seg" id="epseg" style="margin-bottom:10px"><button type="button" aria-pressed="${epSide === "buy"}" data-ep="buy">Buy zone</button><button type="button" aria-pressed="${epSide === "caution"}" data-ep="caution">Caution zone</button></div>${episodesTable(g)}</div></details>
  ${g.id === "ai" ? aiContext() : ""}`;
}

function ltDetail(L) {
  const rows = L.models.map(m => {
    const open = openInd === m.id;
    let h = `<tr class="ind ${open ? "open" : ""}" data-ind="${m.id}" tabindex="0" aria-expanded="${open}"><td><span class="car">›</span> ${esc(m.name)}</td><td>${fval(m)}<small>official ${fval(m, m.official)}, ${esc(m.official_as_of)}</small></td><td>${m.pct.toFixed(0)}th<small>of its history</small></td><td><b>${sgn(m.pred)}</b><small>± ${m.se.toFixed(1)} typical miss</small></td><td>${Math.round(m.r2 * 100)}%<small>of variation explained</small></td><td>${m.oos.mae != null ? `${m.oos.mae.toFixed(1)} pts<small>vs ${m.oos.mae_naive.toFixed(1)} using the average</small>` : "—"}</td></tr>`;
    if (open) h += `<tr class="exp"><td colspan="6"><div class="expg"><div><p><b>What it is.</b> ${esc(m.what)}</p><p><b>Why it is here.</b> ${esc(m.why)}</p>${m.extrapolated ? `<p><b>Outside its history.</b> Today's reading is above every value the model was fitted on (previous high ${fval(m, m.hist_max)}, ${fdate(m.hist_max_date, { month: "short", year: "numeric" })}), so the estimate is an extrapolation.</p>` : ""}<p class="muted">Fitted on 10-year windows starting ${m.since} or later. Out-of-sample check: refit at each date using only windows that had already finished (${m.oos.n} forecasts since ${fdate(m.oos.from, { year: "numeric" })}, correlation with the outcome ${m.oos.corr}). Source: ${esc(m.source)}.</p></div><div><div class="chart md" id="indchart"></div><div class="legend" style="padding:6px 0 0"><span><i class="ln" style="background:var(--s1)"></i>Model's estimate at the time</span><span><i class="ln" style="background:var(--s2)"></i>What the next 10 years delivered</span></div></div></div></td></tr>`;
    return h;
  }).join("");
  const e = L.expected;
  return `<div class="dhead"><h2>S&amp;P 500 · next 10 years</h2><span class="zone">${sgn(e.mid)} a year · ${esc(L.zone)}</span><a class="x" href="#">Close</a></div>
  <p class="dsub">What today's valuation has historically meant for the following decade, as a nominal total return (dividends included, before inflation). This layer moves slowly and says nothing about the next year: expensive markets have stayed expensive for a long time. Use it to set expectations and overall exposure, and the tactical gauges for timing.</p>
  <div class="kv"><div class="card"><div class="k">Expected, next 10 years</div><div class="v num">${sgn(e.mid)}</div><div class="s">a year, average of the two models</div></div><div class="card"><div class="k">Model range</div><div class="v num">${sgn(e.low, 1, "")} to ${sgn(e.high)}</div><div class="s">a year</div></div><div class="card"><div class="k">Long-run average</div><div class="v num">${sgn(L.hist_avg)}</div><div class="s">a year, 10-year windows since 1951</div></div><div class="card"><div class="k">10-year Treasury</div><div class="v num">${L.treasury10 != null ? L.treasury10.toFixed(2) + "%" : "—"}</div><div class="s">the alternative, held to maturity</div></div></div>
  <section class="blk"><div class="bh"><h3>The two models</h3><span class="sub">select a row for its history</span></div>
  <div class="card scroll"><table><thead><tr><th>Measure</th><th>Today</th><th>Percentile</th><th>Implied 10-year return</th><th>Fit</th><th>Average miss, out of sample</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="note">Each model is a one-variable regression of the subsequent 10-year return on the measure. Ten-year windows overlap heavily, so there are only about seven independent decades behind these fits and the true uncertainty is wider than "typical miss" suggests. Today's values are moved from the last official figure with the S&amp;P 500's change since.</p></section>`;
}

/* ---------------------------------------------------------------- charts */
function dispose() { charts.forEach(c => c.dispose()); charts = []; }
function mk(el) { const c = echarts.init(el, null, { renderer: "canvas" }); charts.push(c); return c; }
const cutoff = () => { if (range === "Max") return null; const d = new Date(D.as_of + "T12:00:00"); d.setFullYear(d.getFullYear() - parseInt(range)); return d.toISOString().slice(0, 10); };
const base = () => ({ ink: tok("--ink"), ink2: tok("--ink-2"), muted: tok("--muted"), grid: tok("--grid"), surface: tok("--surface"), z1: tok("--z1"), z5: tok("--z5"), s1: tok("--s1"), s2: tok("--s2") });
const axisCommon = c => ({ axisLine: { lineStyle: { color: c.grid } }, axisTick: { show: false }, axisLabel: { color: c.muted, fontSize: 11 }, splitLine: { lineStyle: { color: c.grid } } });
const tipCommon = c => ({ backgroundColor: c.surface, borderColor: c.grid, borderWidth: 1, textStyle: { color: c.ink, fontSize: 12 }, extraCssText: "box-shadow:0 6px 20px rgba(0,0,0,.14);border-radius:8px;" });

function histChart(g) {
  const el = $("#hist"); if (!el || !H) return;
  const h = H[g.id], c = base(), cut = cutoff();
  const i0 = cut ? Math.max(0, h.dates.findIndex(d => d >= cut)) : 0;
  const dates = h.dates.slice(i0), sc = dates.map((d, i) => [d, h.score[i0 + i]]), px = dates.map((d, i) => [d, h.price[i0 + i]]);
  const first = dates[0], day = 864e5;
  const areas = g.episodes.buy.filter(e => e.end >= first).map(e => { const s = e.start < first ? first : e.start; const minEnd = new Date(new Date(s).getTime() + (range === "1Y" ? 2 : range === "5Y" ? 8 : 20) * day).toISOString().slice(0, 10); return [{ xAxis: s }, { xAxis: e.end > minEnd ? e.end : minEnd }]; });
  const zoneOf = v => D.zones.find(z => v >= z.lo && (v < z.hi || z.hi === 100)) || D.zones[2];
  const name = g.benchmark.split(" (")[0], log = range === "Max";
  mk(el).setOption({
    animation: false, axisPointer: { link: [{ xAxisIndex: "all" }] },
    tooltip: { trigger: "axis", ...tipCommon(c), axisPointer: { type: "line", lineStyle: { color: c.muted, width: 1 } },
      formatter: ps => { const s = ps.find(p => p.seriesIndex === 0), p = ps.find(p => p.seriesIndex === 1); const v = s && s.value[1]; return `<div style="color:${c.muted};margin-bottom:2px">${fdate((s || p).value[0])}</div>` + (v != null ? `Score <b>${v.toFixed(0)}</b> · ${zoneOf(v).label}<br>` : "") + (p && p.value[1] != null ? `${name} <b>${p.value[1].toLocaleString()}</b>` : ""); } },
    title: [{ text: "Score", left: 8, top: 6, textStyle: { color: c.ink2, fontSize: 12, fontWeight: 500 } }, { text: name + (log ? " (log scale)" : ""), left: 8, top: "50%", textStyle: { color: c.ink2, fontSize: 12, fontWeight: 500 } }],
    grid: [{ left: 48, right: 18, top: 30, height: "36%" }, { left: 48, right: 18, top: "57%", bottom: 30 }],
    xAxis: [{ type: "time", gridIndex: 0, ...axisCommon(c), axisLabel: { show: false }, splitLine: { show: false } }, { type: "time", gridIndex: 1, ...axisCommon(c), splitLine: { show: false } }],
    yAxis: [{ gridIndex: 0, min: 0, max: 100, interval: 25, ...axisCommon(c) }, { gridIndex: 1, type: log ? "log" : "value", scale: true, ...axisCommon(c), axisLabel: { color: c.muted, fontSize: 11, formatter: v => v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + "k" : v } }],
    series: [
      { name: "Score", type: "line", xAxisIndex: 0, yAxisIndex: 0, data: sc, showSymbol: false, connectNulls: false, lineStyle: { width: 1.5, color: c.ink }, itemStyle: { color: c.ink },
        markArea: { silent: true, data: [[{ yAxis: 0, itemStyle: { color: c.z1, opacity: .22 } }, { yAxis: 10 }], [{ yAxis: 90, itemStyle: { color: c.z5, opacity: .22 } }, { yAxis: 100 }]] } },
      { name, type: "line", xAxisIndex: 1, yAxisIndex: 1, data: px, showSymbol: false, lineStyle: { width: 1.5, color: c.ink }, itemStyle: { color: c.ink },
        markArea: { silent: true, itemStyle: { color: c.z1, opacity: .3 }, data: areas } }],
  });
}

function indChart(g) {
  const el = $("#indchart"); if (!el || !H || !openInd) return;
  const c = base();
  if (view === "lt") {
    const h = H.longterm[openInd]; if (!h) return;
    mk(el).setOption({ animation: false, grid: { left: 44, right: 16, top: 16, bottom: 28 },
      tooltip: { trigger: "axis", ...tipCommon(c), formatter: ps => `<div style="color:${c.muted}">${fdate(ps[0].value[0], { month: "short", year: "numeric" })}</div>` + ps.filter(p => p.value[1] != null).map(p => `${p.marker} ${p.seriesName} <b>${sgn(p.value[1])}</b> a year`).join("<br>") },
      xAxis: { type: "time", ...axisCommon(c), splitLine: { show: false } }, yAxis: { type: "value", ...axisCommon(c), axisLabel: { color: c.muted, fontSize: 11, formatter: "{value}%" } },
      series: [{ name: "Estimate", type: "line", showSymbol: false, data: h.dates.map((d, i) => [d, h.pred[i]]), lineStyle: { width: 2, color: c.s1 }, itemStyle: { color: c.s1 } }, { name: "Delivered", type: "line", showSymbol: false, data: h.dates.map((d, i) => [d, h.realized[i]]), lineStyle: { width: 2, color: c.s2 }, itemStyle: { color: c.s2 } }] });
    return;
  }
  const h = H[g.id], i = g.indicators.find(x => x.id === openInd), vals = h.ind[openInd]; if (!vals || !i) return;
  const cut = cutoff(), i0 = cut ? Math.max(0, h.dates.findIndex(d => d >= cut)) : 0;
  const data = h.dates.slice(i0).map((d, k) => [d, vals[i0 + k]]);
  mk(el).setOption({ animation: false, grid: { left: 46, right: 14, top: 26, bottom: 26 },
    title: { text: `${i.name} · ${range === "Max" ? "all history" : "last " + range.toLowerCase().replace("y", " years").replace("1 years", "year")}`, left: 4, top: 2, textStyle: { color: c.ink2, fontSize: 12, fontWeight: 500 } },
    tooltip: { trigger: "axis", ...tipCommon(c), formatter: ps => ps[0].value[1] == null ? "" : `<div style="color:${c.muted}">${fdate(ps[0].value[0])}</div><b>${fval(i, ps[0].value[1])}</b>` },
    xAxis: { type: "time", ...axisCommon(c), splitLine: { show: false } }, yAxis: { type: "value", scale: true, ...axisCommon(c) },
    series: [{ type: "line", showSymbol: false, data, lineStyle: { width: 1.5, color: c.ink }, itemStyle: { color: c.ink } }] });
}

function gpuChart() {
  const el = $("#gpuchart"), g = D.ai_context && D.ai_context.gpu_spot; if (!el || !g || !el.offsetParent) return;
  const c = base();
  mk(el).setOption({ animation: false, grid: { left: 40, right: 14, top: 14, bottom: 26 },
    tooltip: { trigger: "axis", ...tipCommon(c), formatter: ps => `<div style="color:${c.muted}">${fdate(ps[0].value[0])}</div>Index <b>${ps[0].value[1].toFixed(1)}</b>` },
    xAxis: { type: "time", ...axisCommon(c), splitLine: { show: false } }, yAxis: { type: "value", scale: true, ...axisCommon(c) },
    series: [{ type: "line", showSymbol: false, data: g.dates.map((d, i) => [d, g.index[i]]), lineStyle: { width: 2, color: c.ink }, itemStyle: { color: c.ink } }] });
}

/* ---------------------------------------------------------------- wiring */
async function renderDetail() {
  dispose();
  const el = $("#detail");
  if (!view) { el.hidden = true; el.innerHTML = ""; return; }
  const g = D.gauges[view];
  if (view === "lt" && !D.longterm) { view = null; el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = view === "lt" ? ltDetail(D.longterm) : gaugeDetail(g);
  el.querySelectorAll("tr.ind").forEach(r => { const go = () => { openInd = openInd === r.dataset.ind ? null : r.dataset.ind; renderDetail(); }; r.onclick = go; r.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } }; });
  el.querySelectorAll("#rangeseg button").forEach(b => b.onclick = () => { range = b.dataset.range; renderDetail(); });
  el.querySelectorAll("#epseg button").forEach(b => b.onclick = () => { epSide = b.dataset.ep; renderDetail(); });
  el.querySelectorAll("th.sortable").forEach(t => t.onclick = () => { const k = t.dataset.sort; if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = k === "ticker" || k === "layer" || k === "next_report" ? 1 : -1; } folds.add("co"); renderDetail(); });
  el.querySelectorAll("details.fold").forEach(d => { if (folds.has(d.dataset.fold)) d.open = true; d.ontoggle = () => { d.open ? folds.add(d.dataset.fold) : folds.delete(d.dataset.fold); if (d.dataset.fold === "gpu" && d.open) gpuChart(); if (d.open) charts.forEach(c => c.resize()); }; });
  if (!H) { try { H = await (await fetch("../data/signals_history.json?t=" + encodeURIComponent(D.generated_at))).json(); } catch (e) { H = null; } }
  if (view !== "lt") histChart(g);
  indChart(g);
  gpuChart();
  if (jump && innerWidth <= 860) el.scrollIntoView({ behavior: "smooth", block: "start" });   // stacked tiles push the detail off screen
  jump = false;
}

function renderMeta() {
  $("#asof").innerHTML = `Close of <b>${fdate(D.as_of)}</b>`;
  const bad = D.sources.filter(s => !s.ok);
  $("#srcdot").className = "sdot " + (bad.length ? "warning" : "good");
  $("#srclbl").textContent = bad.length ? `${bad.length} source issue${bad.length > 1 ? "s" : ""}` : "All sources current";
  const nxt = new Date(D.next_refresh_utc);
  $("#srcpanel").innerHTML = `<ul>${D.sources.map(s => `<li><span class="sdot ${s.ok ? "good" : "warning"}"></span><span class="nm">${esc(s.name)}${s.note ? `<small>${esc(s.note)}</small>` : ""}</span><span class="muted">${s.latest ? fdate(s.latest, { month: "short", day: "numeric" }) : ""}</span></li>`).join("")}</ul><p class="muted" style="margin:10px 0 0">Rebuilt ${new Date(D.generated_at).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}. Next scheduled run around ${nxt.toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit" })}, after each US session.</p>`;
  $("#foot").innerHTML = `<p><b>How to read this.</b> Scores rank today's fear against history using only what was known on each day. The tables report what followed similar readings; they are frequencies from the past, not forecasts, and the buy side is far better supported than the sell side. Inputs and zone edges were chosen on this same history, which flatters every number here to some degree. Not investment advice.</p><p>Data: Yahoo Finance, Cboe, FRED (Federal Reserve Z.1), shillerdata.com, SSGA, Finnhub, Nebius. Updated automatically after each US trading day.</p>`;
}

function route() {
  const h = location.hash.replace("#", "");
  const next = ["spx", "ai", "lt"].includes(h) ? h : null;
  if (next !== view) { openInd = null; }
  view = next;
  if (!D) return;
  renderTiles(); renderDetail();
}

$("#theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const nxt = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = nxt;
  try { localStorage.setItem("mg-theme", nxt); } catch (e) { /* storage blocked */ }
  if (D) renderDetail();
};
document.addEventListener("click", e => { const p = $("#srcpop"); if (p.open && !p.contains(e.target)) p.open = false; });
addEventListener("hashchange", route);
addEventListener("resize", () => charts.forEach(c => c.resize()));
fetch("../data/signals.json?t=" + Date.now()).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { D = d; renderMeta(); route(); })
  .catch(e => { $("#tiles").innerHTML = `<div class="empty">Could not load data/signals.json (${esc(e.message)}).</div>`; });
</script>
</body>
</html>
