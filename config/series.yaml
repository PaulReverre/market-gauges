# Raw ingestion manifest. `fetch` says what each source client pulls; `specs`
# gives every raw series its expected frequency, release lag and sanity bounds.
# Indicators in config/indicators.yaml (Phase 2) are built from these series.

fetch:
  fred:
    # Not revised after publication: stored with vintage = NULL.
    series: [SP500, VIXCLS, VXNCLS, DGS10, DFII10, T10Y3M, T10YIE, SOFR, IORB, DFF,
             RRPONTSYD, WTREGEN, WALCL, DTWEXBGS,
             BAMLH0A0HYM2, BAMLH0A0HYM2EY, BAMLC0A0CMEY, BAMLH0A3HYC, BAMLH0A1HYBB, BAMLC0A4CBBB,
             BAA10Y, AAA10Y]   # Moody's: long-history fallback for the 3y ICE BofA window
  alfred:
    # Revised series: every vintage is stored (vintage = FRED realtime_start).
    series: [GDPNOW, CFNAIMA3, ICSA, SAHMREALTIME, PERMIT, NCBEILQ027S, GDP, PCEPILFE, RRSFS,
             DRCCLACBS, UMCSENT, DRTSCILM, NFCI, STLFSI4,
             RAMPAIALL, RAMPAIANTHROPIC, RAMPAIOPENAI, RAMPAIXAI,
             GACDFSA066MSFRBPHI, GACDISA066MSFRBNY, BACTSAMFRBDAL]
  cboe:
    indices: [VIX, VIX3M, VIX9D, VVIX, SKEW, COR1M, COR3M, VXN]
    putcall_json_start: 2019-10-07
  yfinance:
    symbols: ["^GSPC", "^MOVE", SPY, RSP, SPHB, SPLV, IWM, IEF, HYG, LQD, JNK,
              "HG=F", "GC=F", SMH, SOXX, IGV, SOXL, NVDL, "KRW=X"]
    history_start: 2000-01-01
    constituent_years: 7
    info_symbols: [SOXL, NVDL]          # plus every basket ticker
    option_chains: [NVDA, SMH]          # full chains, for IV and skew
    option_chain_max_days: 120
    option_volume_max_days: 45          # basket call/put volume
  edgar:
    tickers: [MSFT, GOOGL, AMZN, META, ORCL, NVDA, CRWV]
    tags: [PaymentsToAcquirePropertyPlantAndEquipment, PaymentsToAcquireProductiveAssets,
           FinanceLeasePrincipalPayments, NetCashProvidedByUsedInOperatingActivities,
           RevenueRemainingPerformanceObligation, DepreciationDepletionAndAmortization,
           DepreciationAndAmortization, Depreciation, Revenues,
           RevenueFromContractWithCustomerExcludingAssessedTax]
  finnhub:
    calendar_days_ahead: 60
  openrouter:
    start: 2025-01-01
  cftc:
    contracts: {"13874A": es, "209742": nq}
    fields: [open_interest_all, asset_mgr_positions_long, asset_mgr_positions_short,
             lev_money_positions_long, lev_money_positions_short,
             dealer_positions_long_all, dealer_positions_short_all]
  factset:
    backfill_since: 2025-01-01
  tsmc:
    start_year: 2015
  mops:
    start: 2019-01-01
    tickers: {"2330": TSMC, "2382": Quanta, "3231": Wistron, "6669": Wiwynn, "3661": Alchip}
  gdelt:
    queries: {ai: '"artificial intelligence"', semis: semiconductor, nvidia: nvidia}
  wikimedia:
    articles: [Nvidia, AI_bubble, Artificial_intelligence]
    start: 2015-07-01
  eia:
    states: [US, VA, TX, GA, AZ, OR, OH, IA, IL]
  treasury:
    start_year: 2024

# Scheduled cadence (GitHub Actions): the daily job pulls every source not
# listed here; Saturday's job pulls the weekly ones, the 12th of each month the
# monthly ones (after TSMC/MOPS publish around the 10th). Local runs pull all.
cadence:
  weekly: [cftc, naaim, aaii, factset, btos]
  monthly: [finra, tsmc, mops, shiller, uvik, eia]

# First match wins (fnmatch on "source:series"). freq: 1d, 1w, 2w, 1mo, 3mo.
# lag_days (days after obs_date) applies only when a row has no vintage. Monthly
# and quarterly rows are dated the first day of the period, as FRED does. Out-of-bounds rows are
# rejected and flagged.
specs:
  - {match: "fred:SP500",          freq: 1d,  bounds: [500, 20000]}
  - {match: "fred:VIXCLS",         freq: 1d,  bounds: [5, 150]}
  - {match: "fred:VXNCLS",         freq: 1d,  bounds: [5, 200]}
  - {match: "fred:BAMLH0A0HYM2",   freq: 1d,  bounds: [1, 25]}
  - {match: "fred:BAMLH0A3HYC",    freq: 1d,  bounds: [1, 60]}
  - {match: "fred:BAMLH0A1HYBB",   freq: 1d,  bounds: [0.2, 20]}
  - {match: "fred:BAMLC0A4CBBB",   freq: 1d,  bounds: [0.2, 10]}
  - {match: "fred:BAML*EY",        freq: 1d,  bounds: [0.5, 30]}
  - {match: "fred:BAA10Y",         freq: 1d,  bounds: [0, 10]}
  - {match: "fred:AAA10Y",         freq: 1d,  bounds: [-2, 6]}
  - {match: "fred:DGS10",          freq: 1d,  bounds: [0, 20]}
  - {match: "fred:DFII10",         freq: 1d,  bounds: [-3, 8]}
  - {match: "fred:T10Y3M",         freq: 1d,  bounds: [-6, 6]}
  - {match: "fred:T10YIE",         freq: 1d,  bounds: [-1, 6]}
  - {match: "fred:SOFR",           freq: 1d,  bounds: [-1, 25]}
  - {match: "fred:IORB",           freq: 1d,  bounds: [-1, 25]}
  - {match: "fred:DFF",            freq: 1d,  bounds: [-1, 25]}
  - {match: "fred:RRPONTSYD",      freq: 1d,  bounds: [0, 5000]}
  - {match: "fred:WTREGEN",        freq: 1w,  bounds: [0, 3000000]}
  - {match: "fred:WALCL",          freq: 1w,  bounds: [0, 20000000]}
  - {match: "fred:DTWEXBGS",       freq: 1d,  bounds: [50, 200]}
  - {match: "alfred:GDPNOW",       freq: 1w,  bounds: [-80, 80]}    # Q2 2020 nowcasts reached -54
  - {match: "alfred:CFNAIMA3",     freq: 1mo, bounds: [-10, 5]}
  - {match: "alfred:ICSA",         freq: 1w,  bounds: [100000, 7000000]}
  - {match: "alfred:SAHMREALTIME", freq: 1mo, bounds: [-1, 10]}
  - {match: "alfred:PERMIT",       freq: 1mo, bounds: [200, 3000]}
  - {match: "alfred:NCBEILQ027S",  freq: 3mo, bounds: [0, 300000000]}
  - {match: "alfred:GDP",          freq: 3mo, bounds: [0, 100000]}
  - {match: "alfred:PCEPILFE",     freq: 1mo, bounds: [5, 300]}
  - {match: "alfred:RRSFS",        freq: 1mo, bounds: [10000, 500000]}
  - {match: "alfred:DRCCLACBS",    freq: 3mo, bounds: [0, 15]}
  - {match: "alfred:UMCSENT",      freq: 1mo, bounds: [20, 120]}
  - {match: "alfred:DRTSCILM",     freq: 3mo, bounds: [-100, 100]}
  - {match: "alfred:NFCI",         freq: 1w,  bounds: [-3, 10]}
  - {match: "alfred:STLFSI4",      freq: 1w,  bounds: [-5, 20]}
  - {match: "alfred:RAMPAI*",      freq: 1mo, bounds: [0, 100]}
  - {match: "alfred:*MSFRB*",      freq: 1mo, bounds: [-100, 100]}
  - {match: "alfred:BACTSAMFRBDAL", freq: 1mo, bounds: [-100, 100]}
  - {match: "cboe:VIX",            freq: 1d,  bounds: [5, 150]}
  - {match: "cboe:VIX3M",          freq: 1d,  bounds: [5, 120]}
  - {match: "cboe:VIX9D",          freq: 1d,  bounds: [3, 200]}
  - {match: "cboe:VVIX",           freq: 1d,  bounds: [10, 250]}   # first weeks of 2006 printed 15-38
  - {match: "cboe:SKEW",           freq: 1d,  bounds: [90, 200]}
  - {match: "cboe:COR*",           freq: 1d,  bounds: [0, 100]}
  - {match: "cboe:VXN",            freq: 1d,  bounds: [5, 200]}
  - {match: "cboe:pc_*",           freq: 1d,  bounds: [0.05, 10]}
  - {match: "yfinance:^MOVE.close", freq: 1d, bounds: [30, 300]}
  - {match: "yfinance:*.close",    freq: 1d,  bounds: [0.0001, 1000000000]}
  - {match: "yfinance:*.volume",   freq: 1d,  bounds: [0, 1000000000000]}
  - {match: "yfinance:*.dividend", freq: 3mo, bounds: [0, 100000]}
  - {match: "yfinance:*.split",    freq: 3mo, bounds: [0.001, 1000]}
  - {match: "yfinance:*.forward_pe", freq: 1d, bounds: [-500, 2000]}
  - {match: "yfinance:*.market_cap", freq: 1d, bounds: [1000000, 100000000000000000]}   # local currency (KRW for .KS)
  - {match: "yfinance:*.shares_out", freq: 1d, bounds: [1000, 1000000000000]}
  - {match: "yfinance:*.total_assets", freq: 1d, bounds: [100000, 10000000000000]}
  - {match: "yfinance:*.nav",      freq: 1d,  bounds: [0.0001, 10000000]}
  - {match: "yfinance:*.opt_*_volume", freq: 1d, bounds: [0, 1000000000]}
  - {match: "finra:*",             freq: 1mo, lag_days: 52, bounds: [0, 100000000]}
  - {match: "finnhub:*",           freq: 3mo, bounds: [-1000, 1000]}
  - {match: "factset:fwd_pe",      freq: 1w,  bounds: [5, 60]}
  - {match: "factset:q_growth_est", freq: 1w, bounds: [-80, 200]}
  - {match: "factset:eps_beat_pct", freq: 1w, bounds: [0, 100]}
  - {match: "factset:*_guidance",  freq: 1w,  bounds: [0, 500]}
  - {match: "shiller:cape",        freq: 1mo, lag_days: 31, bounds: [3, 60]}
  - {match: "shiller:*",           freq: 1mo, lag_days: 31, bounds: [-1000, 100000000]}
  - {match: "tsmc:*",              freq: 1mo, lag_days: 41, bounds: [10000, 5000000]}
  - {match: "mops:*",              freq: 1mo, lag_days: 41, bounds: [0, 5000000000]}
  - {match: "uvik:*",              freq: 1mo, bounds: [0.05, 200]}
  - {match: "gpuperhour:*",        freq: 1d,  bounds: [0.01, 200]}
  - {match: "openrouter:*",        freq: 1d,  bounds: [0, 10000000000000000]}
  - {match: "cftc:*",              freq: 1w,  bounds: [-100000000, 100000000]}
  - {match: "btos:*",              freq: 2w,  bounds: [0, 100]}
  - {match: "naaim:*",             freq: 1w,  bounds: [-200, 200]}
  - {match: "aaii:*",              freq: 1w,  bounds: [0, 100]}
  - {match: "gdelt:*",             freq: 1d,  bounds: [-100, 100]}
  - {match: "wikimedia:*",         freq: 1d,  bounds: [0, 100000000]}
  - {match: "eia:*",               freq: 1mo, lag_days: 90, bounds: [0, 100000000]}
  - {match: "treasury:*",          freq: 1d,  bounds: [-1, 25]}
