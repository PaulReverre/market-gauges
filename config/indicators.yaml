  - id: gr_cfnai
    gauge: G2
    pillar: growth
    name: Chicago Fed National Activity Index, 3-month average
    inputs: ["alfred:CFNAIMA3"]
    direction: higher_is_healthy
    weight: 5
    expected_freq: 1mo
    lookback_pct: 20y
