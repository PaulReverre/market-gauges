    inputs: ["alfred:SAHMREALTIME"]
    direction: lower_is_healthy
    weight: 5
    expected_freq: 1mo
    lookback_pct: 20y
    role: display
    validation: "Phase 3 backtest: demote coincident -> display (wrong sign in full sample)"
  - id: gr_permits
