# Indicator registry (BUILD_PROMPT.md Sections 6 and 7).
#
# Each indicator turns raw series (config/series.yaml) into a daily "as-known"
# value: on each trading day, the value computable from data public by then.
# Revised series (source alfred) are rebuilt vintage by vintage; others become
# known at obs_date + lag_days. That value is ranked against its own trailing
# history (lookback_pct), oriented to 0-100 by `direction`, and weighted.
#
# kind:
#   series - `inputs` are "source:series" refs, each with an optional obs-time
#            `op` (+ `args`); `transform` (+ `targs`) combines them per day.
#   panel  - a named computation over many series (constituents, basket,
#            options, XBRL, OpenRouter...), see features.py.
#   event  - built from config/events.yaml entries for `kpi`, scored with
#            `score_map` (numeric breakpoints) or `categories`; no percentile.
#   none   - no free source yet; counts as missing weight in coverage.
#
# role: leading | coincident | contrarian | context | display. Weight 0 or
# role display keeps an indicator out of its gauge (shown only).
# lookback_pct defaults to 5y for daily series and 20y otherwise; `all` uses
# every available day and badges anything under 2 years as short-history.
# fragility: higher_is_fragile | lower_is_fragile marks overlay members.
# Weights are relative within a pillar. Directions: higher_is_greed,
# lower_is_greed (G1, G3); higher_is_healthy, lower_is_healthy (G2, G4).

gauges:
  G1:
    name: US Equity Sentiment & Volatility
    scale: [Extreme Fear, Fear, Neutral, Greed, Extreme Greed]
    smoothing: ema3
    pillars: {volatility: 30, trend_breadth: 30, credit_funding: 20, positioning: 15, safe_haven: 5}
  G2:
    name: US Equity Fundamental State
    scale: [Breaking down, Weakening, Stable, Strong, Very strong]
    smoothing: ema3
    pillars: {growth: 30, earnings: 25, valuation: 20, rates_liquidity: 15, consumer_credit: 10}
  G3:
    name: AI Sector Sentiment & Volatility
    scale: [Extreme Fear, Fear, Neutral, Greed, Euphoria]
    smoothing: ema3
    pillars: {trend_rs: 30, implied_vol: 30, crowding: 25, attention: 15}
  G4:
    name: AI Fundamental Health
    scale: [Breaking down, Weakening, Stable, Strong, Very strong]
    smoothing: none
    pillars: {spend: 15, supply_chain: 20, monetization: 25, compute_econ: 10, financing: 20, valuation: 10}

indicators:
  # ======================================================================
  # G1 Equity Sentiment & Volatility
  # ----------------------------------------------------------- volatility
  - id: vol_ts
    gauge: G1
    pillar: volatility
    name: VIX / VIX3M term structure
    inputs: ["cboe:VIX", "cboe:VIX3M"]
    transform: ratio
    direction: lower_is_greed
    weight: 6
    expected_freq: 1d
    bounds: [0.5, 1.6]
    role: leading
    fragility: higher_is_fragile
    notes: Ratio above 1.0 is backwardation, historically tied to acute stress.
  - id: vol_vrp
    gauge: G1
    pillar: volatility
    name: VIX minus 20d realized S&P 500 vol
    inputs: ["cboe:VIX", "yfinance:^GSPC.close"]
    transform: vrp
    targs: {window: 20}
    direction: lower_is_greed
    weight: 4
    expected_freq: 1d
    role: leading
    notes: A thin premium means complacency.
    validation: "Phase 3 backtest: removed from fragility overlay (more fragile did not precede deeper drawdowns)"
  - id: vol_vvix
    gauge: G1
    pillar: volatility
    name: VVIX
    inputs: ["cboe:VVIX"]
    direction: lower_is_greed
    weight: 2
    expected_freq: 1d
    role: leading
    fragility: higher_is_fragile
  - id: vol_vvix_ratio
    gauge: G1
    pillar: volatility
    name: VVIX / VIX
    inputs: ["cboe:VVIX", "cboe:VIX"]
    transform: ratio
    direction: lower_is_greed
    weight: 2
    expected_freq: 1d
    role: display
    validation: "Phase 3 backtest: demote leading -> display (wrong sign in full sample); removed from fragility overlay (more fragile did not precede deeper drawdowns)"
  - id: vol_9d
    gauge: G1
    pillar: volatility
    name: VIX9D / VIX
    inputs: ["cboe:VIX9D", "cboe:VIX"]
    transform: ratio
    direction: lower_is_greed
    weight: 3
    expected_freq: 1d
    role: coincident
  - id: vol_move
    gauge: G1
    pillar: volatility
    name: MOVE index (Yahoo, unofficial)
    inputs: ["yfinance:^MOVE.close"]
    direction: lower_is_greed
    weight: 3
    expected_freq: 1d
    role: leading
  - id: eq_vix50
    gauge: G1
    pillar: volatility
    name: VIX vs its 50-day average
    inputs: [{ref: "cboe:VIX", op: pct_from_ma, args: {window: 50}}]
    direction: lower_is_greed
    weight: 4
    expected_freq: 1d
    role: display
    cnn: true
    validation: "Phase 3 backtest: demote coincident -> display (sign holds in only 3/8 regimes)"
  - id: eq_pc5
    gauge: G1
    pillar: volatility
    name: Total put/call, 5-day average
    inputs: [{ref: "cboe:pc_total", op: rolling_mean, args: {window: 5}}]
    direction: lower_is_greed
    weight: 3
    expected_freq: 1d
    role: contrarian
    cnn: true
  - id: eq_pc_equity
    gauge: G1
    pillar: volatility
    name: Equity put/call, 10-day average
    inputs: [{ref: "cboe:pc_equity", op: rolling_mean, args: {window: 10}}]
    direction: lower_is_greed
    weight: 3
    expected_freq: 1d
    role: contrarian
  - id: vol_cor
    gauge: G1
    pillar: volatility
    name: Cboe 1-month implied correlation (COR1M)
    inputs: ["cboe:COR1M"]
    direction: lower_is_greed
    weight: 0
    expected_freq: 1d
    role: display
    validation: "Phase 3 backtest: removed from fragility overlay (holds in only 1/8 regimes)"
  # -------------------------------------------------------- trend_breadth
  - id: eq_mom125
    gauge: G1
    pillar: trend_breadth
    name: S&P 500 vs 125-day average
    inputs: [{ref: "yfinance:^GSPC.close", op: pct_from_ma, args: {window: 125}}]
    direction: higher_is_greed
    weight: 5
    expected_freq: 1d
    role: coincident
    cnn: true
  - id: eq_nh_nl
    gauge: G1
    pillar: trend_breadth
    name: Net 52-week highs minus lows, S&P 500 members (10d avg)
    kind: panel
    panel: net_highs_lows
    targs: {window: 252, smooth: 10}
    direction: higher_is_greed
    weight: 4
    expected_freq: 1d
    role: coincident
    cnn: true
    notes: CNN uses NYSE highs/lows. Current members only, so survivorship-biased.
  - id: eq_mcclellan
    gauge: G1
    pillar: trend_breadth
    name: McClellan summation, S&P 500 member advancing vs declining volume
    kind: panel
    panel: mcclellan_summation
    direction: higher_is_greed
    weight: 4
    expected_freq: 1d
    role: coincident
    cnn: true
    notes: Ratio-adjusted (RANA) volume version. CNN uses NYSE volume.
  - id: br_200
    gauge: G1
    pillar: trend_breadth
    name: Share of S&P 500 members above their 200-day average
    kind: panel
    panel: pct_above_ma
    targs: {window: 200}
    direction: higher_is_greed
    weight: 5
    expected_freq: 1d
    role: display
    notes: Leading when it diverges from the index. Survivorship-biased (current members).
    validation: "Phase 3 backtest: demote leading -> display (sign holds in only 3/8 regimes)"
  - id: br_ew
    gauge: G1
    pillar: trend_breadth
    name: RSP / SPY, 63-day change
    inputs: ["yfinance:RSP.close", "yfinance:SPY.close"]
    transform: ratio_change
    targs: {periods: 63}
    direction: higher_is_greed
    weight: 4
    expected_freq: 1d
    role: display
    validation: "Phase 3 backtest: demote leading -> display (sign holds in only 3/8 regimes); removed from fragility overlay (holds in only 3/8 regimes)"
  - id: br_beta
    gauge: G1
    pillar: trend_breadth
    name: SPHB / SPLV, 63-day change
    inputs: ["yfinance:SPHB.close", "yfinance:SPLV.close"]
    transform: ratio_change
    targs: {periods: 63}
    direction: higher_is_greed
    weight: 3
    expected_freq: 1d
    role: coincident
  - id: br_small
    gauge: G1
    pillar: trend_breadth
    name: IWM / SPY, 63-day change
    inputs: ["yfinance:IWM.close", "yfinance:SPY.close"]
    transform: ratio_change
    targs: {periods: 63}
    direction: higher_is_greed
    weight: 3
    expected_freq: 1d
