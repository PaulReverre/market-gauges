    pillar: earnings
    name: Next-year S&P 500 operating EPS estimate, 13-week change
    kind: none
    direction: higher_is_healthy
    weight: 6
    expected_freq: 1w
    role: leading
    notes: Needs S&P DJI sp-500-eps-est.xlsx, which is blocked (HTTP 403). Missing weight.
  - id: ea_growth
