    direction: higher_is_greed
    weight: 3
    expected_freq: 1mo
    role: display
    validation: "Phase 3 backtest: demote leading -> display (sign holds in only 1/8 regimes); removed from fragility overlay (more fragile did not precede deeper drawdowns)"
  # ----------------------------------------------------------- safe_haven
  - id: eq_safehaven
    gauge: G1
    pillar: safe_haven
    name: 20-day S&P 500 return minus 20-day Treasury (IEF) return
    inputs: ["yfinance:^GSPC.close", "yfinance:IEF.close"]
    transform: return_spread
    targs: {periods: 20}
    direction: higher_is_greed
    weight: 4
