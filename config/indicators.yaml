    name: Broad dollar index, 21-day change
    inputs: [{ref: "fred:DTWEXBGS", op: pct_change, args: {periods: 21}}]
    direction: lower_is_greed
    weight: 2
    expected_freq: 1w   # daily values, published weekly (H.10)
    role: display
    validation: "Phase 3 backtest: demote coincident -> display (wrong sign in full sample)"
  - id: xa_cugold
    gauge: G1
    pillar: safe_haven
    name: Copper / gold, 63-day change
    inputs: ["yfinance:HG=F.close", "yfinance:GC=F.close"]
    transform: ratio_change
    targs: {periods: 63}
    direction: higher_is_greed
