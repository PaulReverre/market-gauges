  - id: cr_ccc_bb
    gauge: G1
    pillar: credit_funding
    name: CCC OAS minus BB OAS
    inputs: ["fred:BAMLH0A3HYC", "fred:BAMLH0A1HYBB"]
    transform: diff
    direction: lower_is_greed
    weight: 4
    expected_freq: 1d
    role: leading
    fragility: higher_is_fragile
  - id: cr_nfci
