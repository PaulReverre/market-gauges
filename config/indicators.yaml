    pillar: positioning
    name: Asset manager + leveraged fund net ES and NQ, % of open interest
    kind: panel
    panel: cftc_net_pct
    direction: higher_is_greed
    weight: 3
    expected_freq: 1w
    role: contrarian
  - id: pos_margin
