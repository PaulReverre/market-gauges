  - id: gr_regional
    gauge: G2
    pillar: growth
    name: Regional Fed manufacturing composite (Philly, NY, Dallas; mean z)
    inputs:
      - {ref: "alfred:GACDFSA066MSFRBPHI", op: zscore, args: {window: 240}}
      - {ref: "alfred:GACDISA066MSFRBNY", op: zscore, args: {window: 240}}
      - {ref: "alfred:BACTSAMFRBDAL", op: zscore, args: {window: 240}}
    transform: mean
    direction: higher_is_healthy
    weight: 4
    expected_freq: 1mo
    lookback_pct: 20y
    role: display
    notes: Richmond and Kansas City composites are not on FRED (3 of 5 surveys).
    validation: "Phase 3 backtest: demote leading -> display (sign holds in only 1/6 regimes)"
  - id: gr_claims
    gauge: G2
    pillar: growth
    name: Initial jobless claims, 4-week average, year over year
    inputs: [{ref: "alfred:ICSA", op: avg_pct_change, args: {window: 4, periods: 52}}]
    direction: lower_is_healthy
    weight: 5
    expected_freq: 1w
    lookback_pct: 20y
    role: display
    validation: "Phase 3 backtest: demote leading -> display (wrong sign in full sample and sign holds in only 3/7 regimes)"
  - id: gr_sahm
    gauge: G2
    pillar: growth
