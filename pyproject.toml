[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-gauges"
version = "2.0.0"
description = "Contrarian market gauges: S&P 500, AI and semiconductors, and a 10-year outlook"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "xlrd>=2.0",
    "yfinance>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
